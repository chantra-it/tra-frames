        cloudStatusEl.style.color = '#10b981';
      }
      return true;
    } catch (err) {
      console.warn("Failed syncing single campaign to Firestore:", docId, err);
      return false;
    }
  },

  parseFirestoreDoc(doc) {
    if (!doc || !doc.fields) return null;
    const result = {};
    for (const [key, val] of Object.entries(doc.fields)) {
      if (val.stringValue !== undefined) result[key] = val.stringValue;
      else if (val.integerValue !== undefined) result[key] = parseInt(val.integerValue, 10);
      else if (val.doubleValue !== undefined) result[key] = parseFloat(val.doubleValue);
      else if (val.booleanValue !== undefined) result[key] = val.booleanValue;
      else if (val.timestampValue !== undefined) result[key] = val.timestampValue;
      else if (val.nullValue !== undefined) result[key] = null;
    }
    return result;
  },

  // Save to memory cache and local storage so subsequent loads are instant
  cacheCloudCampaign(campaign) {
    if (!campaign) return;
    if (campaign.slug) this._memoryCache.set(campaign.slug, campaign);
    if (campaign.id) this._memoryCache.set(campaign.id, campaign);
    try {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      let userCampaigns = stored ? JSON.parse(stored) : [];
      const idx = userCampaigns.findIndex(c => c.slug === campaign.slug || c.id === campaign.id);
      if (idx >= 0) {
        userCampaigns[idx] = campaign;
      } else {
        userCampaigns.unshift(campaign);
      }
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userCampaigns));
    } catch (e) {
      console.warn("Storage quota warning on cacheCloudCampaign:", e);
    }
  },

  // Fetch campaign from Cloud Firestore (SDK + High-Reliability REST fallback)
  async fetchCloudCampaign(identifier) {
    if (!identifier) return null;

    // Check memory cache first
    if (this._memoryCache && this._memoryCache.has(identifier)) {
      return this._memoryCache.get(identifier);
    }

    // 1. Try Firebase SDK if available
    const db = initFirestore();
    if (db) {
      try {
        const docRef = await db.collection("campaigns").doc(identifier).get();
        if (docRef.exists) {
          const data = docRef.data();
          this.cacheCloudCampaign(data);
          return data;
        }

        const snapshot = await db.collection("campaigns").where("slug", "==", identifier).limit(1).get();
        if (!snapshot.empty) {
          const data = snapshot.docs[0].data();
          this.cacheCloudCampaign(data);
          return data;
        }

        const idSnapshot = await db.collection("campaigns").where("id", "==", identifier).limit(1).get();
        if (!idSnapshot.empty) {
          const data = idSnapshot.docs[0].data();
          this.cacheCloudCampaign(data);
          return data;
        }
      } catch (err) {
        console.warn("Firestore SDK notice, switching to direct REST lookup:", err);
      }
    }

    // 2. High-speed Direct REST Fallback (Works 100% reliably on all mobile networks without auth)
    try {
      const restUrl = `https://firestore.googleapis.com/v1/projects/tra-frames/databases/(default)/documents/campaigns/${encodeURIComponent(identifier)}`;
      const res = await fetch(restUrl);
      if (res.ok) {
        const docJson = await res.json();
        const data = this.parseFirestoreDoc(docJson);
        if (data) {
          this.cacheCloudCampaign(data);
          return data;
        }
      }
    } catch (restErr) {
      console.warn("Firestore REST direct lookup error:", restErr);
    }

    return null;
  },

  // Fetch all public campaigns from Cloud Firestore to populate Explore feed
  async fetchAllCloudCampaigns() {
    try {
      const restUrl = `https://firestore.googleapis.com/v1/projects/tra-frames/databases/(default)/documents/campaigns`;
      const res = await fetch(restUrl);
      if (res.ok) {
        const json = await res.json();
        if (json.documents && Array.isArray(json.documents)) {
          const campaigns = json.documents.map(d => this.parseFirestoreDoc(d)).filter(Boolean);
          campaigns.forEach(c => this.cacheCloudCampaign(c));
          return campaigns;
        }
      }
    } catch (err) {
      console.warn("fetchAllCloudCampaigns notice:", err);
    }
    return [];
  },

  // Sync existing local campaigns to Cloud Firestore
  async syncLocalCampaignsToCloud() {
    const db = initFirestore();
    if (!db) return;
    try {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (!stored) return;
      const userCampaigns = JSON.parse(stored);
      let updatedAny = false;
      for (let i = 0; i < userCampaigns.length; i++) {
        let c = userCampaigns[i];
        const docId = c.slug || c.id;
        if (!docId) continue;

        let toSync = { ...c };
        if (toSync.frameUrl && toSync.frameUrl.length > 650000) {
          try {
            toSync.frameUrl = await this.compressFrameDataUrl(toSync.frameUrl);
            userCampaigns[i] = toSync;
            updatedAny = true;
          } catch (e) {}
        }

        try {
          await db.collection("campaigns").doc(docId).set(toSync, { merge: true });
          console.log("🔥 Synced local campaign to Cloud:", docId);
        } catch (e) {
          console.warn("Failed syncing campaign:", docId, e);
        }
      }
      if (updatedAny) {
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userCampaigns));
        } catch (e) {}
      }
    } catch (err) {
      console.warn("Sync to cloud error:", err);
    }
  },

  deleteCampaign(id) {
    try {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (stored) {
        let userCampaigns = JSON.parse(stored);
        userCampaigns = userCampaigns.filter(c => c.id !== id);
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userCampaigns));
        return true;
      }
    } catch (e) {
      console.error("Failed to delete campaign:", e);
    }
    return false;
  },

  getUserCampaigns() {
    try {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      const allUserCampaigns = stored ? JSON.parse(stored) : [];
      const user = AuthService.currentUser;
      if (user) {
        return allUserCampaigns.filter(c => !c.creatorUid || c.creatorUid === user.uid);
      }
      return allUserCampaigns;
    } catch (e) {
      return [];
    }
  },

  incrementSupporter(id) {
    const all = this.getCampaigns();
    const item = all.find(c => c.id === id);
    if (item) {
      item.supporters = (item.supporters || 0) + 1;
      // If it's in user campaigns, update it
      try {
        const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (stored) {
          let userCampaigns = JSON.parse(stored);
          const userIdx = userCampaigns.findIndex(c => c.id === id);
          if (userIdx !== -1) {
            userCampaigns[userIdx].supporters = (userCampaigns[userIdx].supporters || 0) + 1;
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userCampaigns));
          }
        }
      } catch (e) {}
      return item.supporters;
    }
    return 1;
  }
};


// High-Performance Interactive HTML5 Canvas Studio for Twibbon Framing

class CanvasStudio {
  constructor(canvasElement, options = {}) {
    this.canvas = canvasElement;
    this.ctx = canvasElement.getContext('2d');
    this.outputResolution = options.resolution || 1080; // 1080x1080 HD
    
    // Layers
    this.userImage = null;
    this.frameImage = null;

    // Transform State
    this.state = {
      x: 0,
      y: 0,
      scale: 1,
      baseScale: 1,
      rotation: 0,
      flipH: 1,
      flipV: 1,
      // Filters
      brightness: 100,
      contrast: 100,
      saturation: 100,
      sepia: 0,
      grayscale: 0
    };

    // Interaction tracking
    this.isDragging = false;
    this.dragStartX = 0;
    this.dragStartY = 0;
    this.lastPinchDistance = null;

    // Callbacks
    this.onStateChange = options.onStateChange || null;
    this.onPhotoLoaded = options.onPhotoLoaded || null;

    this.initEvents();
  }

  setFrame(sourceUrl) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      if (!sourceUrl.startsWith('data:')) {
        img.crossOrigin = "anonymous";
      }
      img.onload = () => {
        this.frameImage = img;
        this.render();
        resolve();
      };
      img.onerror = (e) => {
        console.error("Failed to load frame image", e);
        reject(e);
      };
      img.src = sourceUrl;
    });
  }

  setUserPhoto(sourceUrlOrFile) {
    return new Promise((resolve, reject) => {
      if (typeof sourceUrlOrFile === 'string') {
        const img = new Image();
        if (!sourceUrlOrFile.startsWith('data:')) {
          img.crossOrigin = "anonymous";
        }
        img.onload = () => {
          this.userImage = img;
          this.fitPhotoToCanvas();
          this.render();
          if (this.onPhotoLoaded) this.onPhotoLoaded();
          resolve();
        };
        img.onerror = reject;
        img.src = sourceUrlOrFile;
      } else if (sourceUrlOrFile instanceof File || sourceUrlOrFile instanceof Blob) {
        if (typeof SecurityUtils !== 'undefined' && sourceUrlOrFile instanceof File) {
          const check = SecurityUtils.validateImageFile(sourceUrlOrFile);
          if (!check.valid) {
            reject(new Error(check.error));
            return;
          }
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            this.userImage = img;
            this.fitPhotoToCanvas();
            this.render();
            if (this.onPhotoLoaded) this.onPhotoLoaded();
            resolve();
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(sourceUrlOrFile);
      }
    });
  }

  fitPhotoToCanvas() {
    if (!this.userImage) return;
    const cw = this.canvas.width;
    const ch = this.canvas.height;
    const iw = this.userImage.width;
    const ih = this.userImage.height;

    // Calculate scale to cover canvas smoothly
    const scaleX = cw / iw;
    const scaleY = ch / ih;
    this.state.baseScale = Math.max(scaleX, scaleY);
    this.state.scale = 1;
    this.state.x = 0;
    this.state.y = 0;
    this.state.rotation = 0;
    this.state.flipH = 1;
    this.state.flipV = 1;
    this.resetFilters();
    this.notifyChange();
  }

  resetFilters() {
    this.state.brightness = 100;
    this.state.contrast = 100;
    this.state.saturation = 100;
    this.state.sepia = 0;
    this.state.grayscale = 0;
    this.notifyChange();
  }

  resetPosition() {
    this.state.x = 0;
    this.state.y = 0;
    this.state.scale = 1;
    this.state.rotation = 0;
    this.state.flipH = 1;
    this.state.flipV = 1;
    this.render();
    this.notifyChange();
  }

  setScale(val) {
    this.state.scale = Math.min(Math.max(val, 0.2), 4.0);
    this.render();
    this.notifyChange();
  }

  setRotation(deg) {
    this.state.rotation = (deg % 360 + 360) % 360;
    this.render();
    this.notifyChange();
  }

  rotate90() {
    this.setRotation(this.state.rotation + 90);
  }

  toggleFlipH() {
    this.state.flipH *= -1;
    this.render();
    this.notifyChange();
  }

  toggleFlipV() {
    this.state.flipV *= -1;
    this.render();
    this.notifyChange();
  }

  setFilter(name, value) {
    if (this.state.hasOwnProperty(name)) {
      this.state[name] = value;
      this.render();
      this.notifyChange();
    }
  }

  notifyChange() {
    if (this.onStateChange) {
      this.onStateChange({ ...this.state });
    }
  }

  initEvents() {
    const el = this.canvas;

    // Mouse Drag Events
    el.addEventListener('mousedown', (e) => {
      if (!this.userImage) return;
      this.isDragging = true;
      const rect = el.getBoundingClientRect();
      const scaleCoord = this.canvas.width / rect.width;
      this.dragStartX = e.clientX * scaleCoord - this.state.x;
      this.dragStartY = e.clientY * scaleCoord - this.state.y;
      el.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
      if (!this.isDragging || !this.userImage) return;
      const rect = el.getBoundingClientRect();
      const scaleCoord = this.canvas.width / rect.width;
      this.state.x = e.clientX * scaleCoord - this.dragStartX;
      this.state.y = e.clientY * scaleCoord - this.dragStartY;
      this.render();
      this.notifyChange();
    });

    window.addEventListener('mouseup', () => {
      if (this.isDragging) {
        this.isDragging = false;
        el.style.cursor = 'grab';
      }
    });

    // Mouse Wheel Zoom
    el.addEventListener('wheel', (e) => {
      if (!this.userImage) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      this.setScale(this.state.scale * zoomFactor);
    }, { passive: false });

    // Touch Drag & Pinch Zoom Events
    el.addEventListener('touchstart', (e) => {
      if (!this.userImage) return;
      e.preventDefault();
      if (e.touches.length === 1) {
        this.isDragging = true;
        const rect = el.getBoundingClientRect();
        const scaleCoord = this.canvas.width / rect.width;
        this.dragStartX = e.touches[0].clientX * scaleCoord - this.state.x;
        this.dragStartY = e.touches[0].clientY * scaleCoord - this.state.y;
      } else if (e.touches.length === 2) {
        this.isDragging = false;
        this.lastPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: false });

    el.addEventListener('touchmove', (e) => {
      if (!this.userImage) return;
      e.preventDefault();
      if (e.touches.length === 1 && this.isDragging) {
        const rect = el.getBoundingClientRect();
        const scaleCoord = this.canvas.width / rect.width;
        this.state.x = e.touches[0].clientX * scaleCoord - this.dragStartX;
        this.state.y = e.touches[0].clientY * scaleCoord - this.dragStartY;
        this.render();
        this.notifyChange();
      } else if (e.touches.length === 2 && this.lastPinchDistance) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / this.lastPinchDistance;
        this.setScale(this.state.scale * factor);
        this.lastPinchDistance = dist;
      }
    }, { passive: false });

    el.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        this.lastPinchDistance = null;
      }
      if (e.touches.length === 1 && this.userImage) {
        this.isDragging = true;
        const rect = el.getBoundingClientRect();
        const scaleCoord = this.canvas.width / rect.width;
        this.dragStartX = e.touches[0].clientX * scaleCoord - this.state.x;
        this.dragStartY = e.touches[0].clientY * scaleCoord - this.state.y;
      } else if (e.touches.length === 0) {
        this.isDragging = false;
      }
    });
  }

  getFilterString() {
    const { brightness, contrast, saturation, sepia, grayscale } = this.state;
    return `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%) sepia(${sepia}%) grayscale(${grayscale}%)`;
  }

  renderToContext(ctx, width, height, isExport = false) {
    // 1. Clear background
    ctx.clearRect(0, 0, width, height);

    // If not export and no photo, draw helpful placeholder
    if (!this.userImage && !isExport) {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 0, width, height);

      // Draw subtle grid
      ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
      ctx.lineWidth = 2;
      const step = 40;
      for (let x = 0; x < width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y < height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }
    }

    // 2. Draw User Image Layer
    if (this.userImage) {
      ctx.save();
      // Move to center + pan offset
      const cx = width / 2 + (this.state.x * (width / this.canvas.width));
      const cy = height / 2 + (this.state.y * (height / this.canvas.height));
      ctx.translate(cx, cy);

      // Rotate
      ctx.rotate((this.state.rotation * Math.PI) / 180);

      // Flip
      ctx.scale(this.state.flipH, this.state.flipV);

      // Calculate scaled dimensions
      const totalScale = this.state.baseScale * this.state.scale * (width / this.canvas.width);
      const iw = this.userImage.width * totalScale;
      const ih = this.userImage.height * totalScale;

      // Filter
      ctx.filter = this.getFilterString();

      // Draw centered
      ctx.drawImage(this.userImage, -iw / 2, -ih / 2, iw, ih);
      ctx.restore();
    }

    // 3. Draw Frame Overlay
    if (this.frameImage) {
      ctx.save();
      ctx.filter = "none";
      ctx.drawImage(this.frameImage, 0, 0, width, height);
      ctx.restore();
    }
  }

  render() {
    this.renderToContext(this.ctx, this.canvas.width, this.canvas.height, false);
  }

  exportHighRes() {
    return new Promise((resolve) => {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = this.outputResolution;
      exportCanvas.height = this.outputResolution;
      const expCtx = exportCanvas.getContext('2d');

      // High image rendering smoothing
      expCtx.imageSmoothingEnabled = true;
      expCtx.imageSmoothingQuality = 'high';

      this.renderToContext(expCtx, this.outputResolution, this.outputResolution, true);

      exportCanvas.toBlob((blob) => {
        resolve(blob);
      }, 'image/png', 1.0);
    });
  }
}

// Confetti Particle System for Celebratory Downloads
function triggerConfetti() {
  const container = document.createElement('div');
  container.className = 'confetti-container';
  document.body.appendChild(container);

  const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
  const particleCount = 70;

  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'confetti-particle';
    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    particle.style.left = `${Math.random() * 100}vw`;
    particle.style.top = '-20px';
    particle.style.transform = `rotate(${Math.random() * 360}deg)`;
    particle.style.animation = `confettiFall ${2 + Math.random() * 2}s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards`;
    particle.style.animationDelay = `${Math.random() * 0.5}s`;
    container.appendChild(particle);
  }

  setTimeout(() => {
    container.remove();
  }, 4500);
}


// Polyfill roundRect for maximum browser compatibility
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, radii) {
    let r = typeof radii === 'number' ? radii : (Array.isArray(radii) ? radii[0] : 0);
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

// Built-in Twibbon Frame Designer Studio
class FrameDesigner {
  constructor(canvasElement, options = {}) {
    this.canvas = canvasElement;
    this.ctx = canvasElement.getContext('2d');
    this.size = options.size || 1000;
    this.canvas.width = this.size;
    this.canvas.height = this.size;

    this.settings = {
      shape: 'circle', // circle, rounded, square, arch, octagon
      theme: 'royalBlue', // royalBlue, emerald, crimson, sunset, midnightGold, cyberNeon, rosePink
      borderWidth: 50,
      ringColor: '#fbbf24',
      headerText: 'CLASS OF 2026',
      headerColor: '#fbbf24',
      headerBg: '#0f172a',
      footerText: 'CONGRATULATIONS!',
      footerColor: '#ffffff',
      footerBg: '#0f172a',
      showCornerAccents: true,
      showSparkles: true
    };

    this.themes = {
      royalBlue: {
        gradient: ['#1e3a8a', '#2563eb', '#1d4ed8'],
        ring: '#fbbf24',
        accent: '#f59e0b'
      },
      emerald: {
        gradient: ['#064e3b', '#059669', '#10b981'],
        ring: '#a7f3d0',
        accent: '#34d399'
      },
      crimson: {
        gradient: ['#7f1d1d', '#b91c1c', '#dc2626'],
        ring: '#fef08a',
        accent: '#eab308'
      },
      sunset: {
        gradient: ['#c2410c', '#ea580c', '#f97316'],
        ring: '#fef08a',
        accent: '#fde047'
      },
      midnightGold: {
        gradient: ['#09090b', '#18181b', '#27272a'],
        ring: '#eab308',
        accent: '#fde047'
      },
      cyberNeon: {
        gradient: ['#1e1b4b', '#3730a3', '#4f46e5'],
        ring: '#06b6d4',
        accent: '#ec4899'
      },
      rosePink: {
        gradient: ['#881337', '#e11d48', '#fb7185'],
        ring: '#ffffff',
        accent: '#fbcfe8'
      }
    };

    this.render();
  }

  update(newSettings) {
    this.settings = { ...this.settings, ...newSettings };
    this.render();
  }

  render() {
    const ctx = this.ctx;
    const s = this.size;
    const center = s / 2;
    const radius = 370;

    // Clear canvas
    ctx.clearRect(0, 0, s, s);

    // Create offscreen canvas for cutout masking
    const maskCanvas = document.createElement('canvas');
    maskCanvas.width = s;
    maskCanvas.height = s;
    const mCtx = maskCanvas.getContext('2d');

    // 1. Draw solid outer frame background on maskCanvas
    const theme = this.themes[this.settings.theme] || this.themes.royalBlue;
    const grad = mCtx.createLinearGradient(0, 0, s, s);
    grad.addColorStop(0, theme.gradient[0]);
    grad.addColorStop(0.5, theme.gradient[1]);
    grad.addColorStop(1, theme.gradient[2]);
    mCtx.fillStyle = grad;
    mCtx.fillRect(0, 0, s, s);

    // 2. Cut out the transparent hole using 'destination-out'
    mCtx.globalCompositeOperation = 'destination-out';
    mCtx.fillStyle = '#000000';
    mCtx.beginPath();

    if (this.settings.shape === 'circle') {
      mCtx.arc(center, center, radius, 0, Math.PI * 2);
    } else if (this.settings.shape === 'rounded') {
      const rw = 720;
      const rh = 720;
      mCtx.roundRect(center - rw / 2, center - rh / 2, rw, rh, 70);
    } else if (this.settings.shape === 'square') {
      const sq = 720;
      mCtx.rect(center - sq / 2, center - sq / 2, sq, sq);
    } else if (this.settings.shape === 'arch') {
      const aw = 680;
      const ah = 720;
      const ax = center - aw / 2;
      const ay = center - ah / 2;
      mCtx.moveTo(ax, ay + ah);
      mCtx.lineTo(ax, ay + aw / 2);
      mCtx.arc(center, ay + aw / 2, aw / 2, Math.PI, 0);
      mCtx.lineTo(ax + aw, ay + ah);
      mCtx.closePath();
    } else if (this.settings.shape === 'octagon') {
      const r = 380;
      for (let i = 0; i < 8; i++) {
        const angle = (i * Math.PI) / 4 - Math.PI / 8;
        const x = center + r * Math.cos(angle);
        const y = center + r * Math.sin(angle);
        if (i === 0) mCtx.moveTo(x, y);
        else mCtx.lineTo(x, y);
      }
      mCtx.closePath();
    }
    mCtx.fill();

    // Reset composite operation
    mCtx.globalCompositeOperation = 'source-over';

    // 3. Draw masked frame to main canvas
    ctx.drawImage(maskCanvas, 0, 0);

    // 4. Draw Inner Ring / Border Accents
    ctx.save();
    ctx.strokeStyle = this.settings.ringColor || theme.ring;
    ctx.lineWidth = 14;
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 15;
    ctx.shadowOffsetY = 6;

    if (this.settings.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(center, center, radius + 2, 0, Math.PI * 2);
      ctx.stroke();

      // Dashed subtle secondary ring
      ctx.beginPath();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.arc(center, center, radius + 18, 0, Math.PI * 2);
      ctx.stroke();
    } else if (this.settings.shape === 'rounded') {
      ctx.beginPath();
      ctx.roundRect(center - 362, center - 362, 724, 724, 72);
      ctx.stroke();
    } else if (this.settings.shape === 'square') {
      ctx.beginPath();
      ctx.rect(center - 362, center - 362, 724, 724);
      ctx.stroke();
    } else if (this.settings.shape === 'arch') {
      const aw = 684;
      const ah = 724;
      const ax = center - aw / 2;
      const ay = center - ah / 2;
      ctx.beginPath();
      ctx.moveTo(ax, ay + ah);
      ctx.lineTo(ax, ay + aw / 2);
      ctx.arc(center, ay + aw / 2, aw / 2, Math.PI, 0);
      ctx.lineTo(ax + aw, ay + ah);
      ctx.closePath();
      ctx.stroke();
    } else if (this.settings.shape === 'octagon') {
      const r = 384;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const angle = (i * Math.PI) / 4 - Math.PI / 8;
        const x = center + r * Math.cos(angle);
        const y = center + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();

    // 5. Corner Accents
    if (this.settings.showCornerAccents) {
      ctx.save();
      ctx.fillStyle = this.settings.ringColor || theme.ring;
      const offset = 60;
      const l = 100;
      // Top Left
      ctx.beginPath();
      ctx.moveTo(offset, offset + l);
      ctx.lineTo(offset + l, offset);
      ctx.lineTo(offset + l + 60, offset);
      ctx.lineTo(offset, offset + l + 60);
      ctx.closePath();
      ctx.fill();

      // Top Right
      ctx.beginPath();
      ctx.moveTo(s - offset, offset + l);
      ctx.lineTo(s - offset - l, offset);
      ctx.lineTo(s - offset - l - 60, offset);
      ctx.lineTo(s - offset, offset + l + 60);
      ctx.closePath();
      ctx.fill();

      // Bottom Left
      ctx.beginPath();
      ctx.moveTo(offset, s - offset - l);
      ctx.lineTo(offset + l, s - offset);
      ctx.lineTo(offset + l + 60, s - offset);
      ctx.lineTo(offset, s - offset - l - 60);
      ctx.closePath();
      ctx.fill();

      // Bottom Right
      ctx.beginPath();
      ctx.moveTo(s - offset, s - offset - l);
      ctx.lineTo(s - offset - l, s - offset);
      ctx.lineTo(s - offset - l - 60, s - offset);
      ctx.lineTo(s - offset, s - offset - l - 60);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 6. Header Badge Pill
    if (this.settings.headerText.trim()) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 6;

      const badgeWidth = Math.min(Math.max(ctx.measureText(this.settings.headerText).width + 120, 480), 760);
      const badgeHeight = 78;
      const bx = center - badgeWidth / 2;
      const by = 48;

      // Outer pill
      ctx.fillStyle = this.settings.headerBg || '#0f172a';
      ctx.beginPath();
      ctx.roundRect(bx, by, badgeWidth, badgeHeight, badgeHeight / 2);
      ctx.fill();

      // Border on pill
      ctx.strokeStyle = this.settings.headerColor || theme.ring;
      ctx.lineWidth = 3.5;
      ctx.stroke();

      // Text
      ctx.fillStyle = this.settings.headerColor || theme.ring;
      ctx.font = "900 32px 'Segoe UI', 'Kantumruy Pro', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.settings.headerText.toUpperCase(), center, by + badgeHeight / 2);
      ctx.restore();
    }

    // 7. Footer Badge / Ribbon
    if (this.settings.footerText.trim()) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 6;

      const footerWidth = Math.min(Math.max(ctx.measureText(this.settings.footerText).width + 120, 460), 780);
      const footerHeight = 78;
      const fx = center - footerWidth / 2;
      const fy = s - 128;

      ctx.fillStyle = this.settings.footerBg || '#0f172a';
      ctx.beginPath();
      ctx.roundRect(fx, fy, footerWidth, footerHeight, 20);
      ctx.fill();

      ctx.strokeStyle = this.settings.ringColor || theme.ring;
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = this.settings.footerColor || '#ffffff';
      ctx.font = "800 30px 'Segoe UI', 'Kantumruy Pro', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.settings.footerText.toUpperCase(), center, fy + footerHeight / 2);
      ctx.restore();
    }
  }

  getTransparentPNGDataUrl() {
    return this.canvas.toDataURL('image/png');
  }
}


// Main Single Page Application Coordinator & Router

class TwibbonApp {
  constructor() {
    this.currentView = 'explore';
    this.activeCampaign = null;
    this.activeStudio = null;
    this.activeDesigner = null;
    this.currentCategory = 'all';
    this.searchQuery = '';

    // Force default to clean light mode
    const storedTheme = localStorage.getItem('twibbon_theme');
    this.theme = (storedTheme === 'dark' || storedTheme === 'light') ? storedTheme : 'light';
    // If it was previous dark, default to light for clean aesthetic
    if (!storedTheme) {
      this.theme = 'light';
      localStorage.setItem('twibbon_theme', 'light');
    }

    this.init();
  }

  init() {
    // 1. Apply theme
    document.documentElement.setAttribute('data-theme', this.theme);

    // 2. Initialize Firebase Auth
    if (typeof AuthService !== 'undefined') {
      AuthService.init();
      AuthService.onAuthStateChanged((user) => {
        this.updateNavAuth(user);
        if (this.currentView === 'create' || this.currentView === 'my-campaigns') {
          this.renderCurrentView();
        }
      });
    }

    // 3. Setup hash routing
    window.addEventListener('hashchange', () => this.handleRoute());

    // 4. Listen for language changes
    document.addEventListener('languageChanged', () => {
      this.updateStaticTranslations();
      this.updateNavAuth(AuthService ? AuthService.currentUser : null);
      this.renderCurrentView();
    });

    // 5. Initial route resolution
    this.updateStaticTranslations();
    this.handleRoute();
  }

  setTheme(theme) {
    this.theme = theme;
    localStorage.setItem('twibbon_theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
    this.updateThemeIcons();
  }

  toggleTheme() {
    this.setTheme(this.theme === 'dark' ? 'light' : 'dark');
  }

  updateThemeIcons() {

  async copyToClipboard(text) {
    if (!text) return false;
    let successful = false;

    // Method 1: Modern navigator.clipboard API
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        successful = true;
      } catch (err) {
        console.warn('navigator.clipboard.writeText failed, attempting fallback...', err);
      }
    }

    // Method 2: Robust Fallback with temporary textarea
    if (!successful) {
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.top = '0';
        textArea.style.left = '-9999px';
        textArea.style.width = '2em';
        textArea.style.height = '2em';
        textArea.style.padding = '0';
        textArea.style.border = 'none';
        textArea.style.outline = 'none';
        textArea.style.boxShadow = 'none';
        textArea.style.background = 'transparent';
        textArea.setAttribute('readonly', '');
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        textArea.setSelectionRange(0, textArea.value.length);
        successful = document.execCommand('copy');
        document.body.removeChild(textArea);
      } catch (err) {
        console.error('execCommand copy fallback failed:', err);
      }
    }

    return successful;
  }

  handleRoute() {
    const hash = window.location.hash.slice(1) || 'explore';
    const parts = hash.split('/');
    const mainRoute = parts[0];
    const param = parts[1];

    this.updateNavLinks(mainRoute);

    if (mainRoute === 'campaign' && param) {
      this.loadCampaignView(param);
    } else if (mainRoute === 'create') {
      this.loadCreateView(param);
    } else if (mainRoute === 'designer') {
      this.loadDesignerView();
    } else if (mainRoute === 'my-campaigns') {
      this.loadMyCampaignsView();
    } else {
      this.loadExploreView();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

      }

  }

    const allCampaigns = CampaignService.getCampaigns();

      const desc = (isKm ? c.descriptionKm : c.descriptionEn) || '';

    const creator = SecurityUtils.escapeHtml(campaign.creator || 'Anonymous');
    const slug = SecurityUtils.escapeHtml(campaign.slug || campaign.id);

                <span>🔗 ${isKm ? 'តំណភ្ជាប់ចែករំលែក (Share Link)' : 'Campaign Share Link'}:</span>
              </div>
              <div class="share-link-input-group">
                <input type="text" class="share-link-input" id="studioShareLinkInput" value="${this.getShareableLink(campaign)}" readonly />
                <button class="btn btn-primary" id="btnCopyStudioLink">
                  ${Icons.copy} <span>${t('copyLink')}</span>
                </button>

                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(this.getShareableLink(campaign))}" class="share-qr-img" alt="QR Code" />

    // Initialize Canvas Studio

    this.activeStudio = new CanvasStudio(canvas, {
      resolution: 1080,
      onStateChange: (state) => {
        const zoomVal = document.getElementById('zoomVal');
        if (zoomVal) zoomVal.textContent = `${Math.round(state.scale * 100)}%`;
        const zoomSlider = document.getElementById('zoomSlider');
        if (zoomSlider) zoomSlider.value = Math.round(state.scale * 100);
      }
    });

    // Load Frame Image
    this.activeStudio.setFrame(campaign.frameUrl);

    // Auto-load First Sample Avatar
    this.activeStudio.setUserPhoto(SAMPLE_AVATARS[0]);

    // Bind Upload Dropzone
    const dropzone = document.getElementById('photoDropzone');
    const fileInput = document.getElementById('photoFileInput');

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        this.activeStudio.setUserPhoto(e.target.files[0]);
        this.showToast(t('choosePhoto') + ' OK!');
      }
    });

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = 'var(--accent-primary)';
      dropzone.style.background = 'var(--accent-soft)';
    });
    dropzone.addEventListener('dragleave', () => {
      dropzone.style.borderColor = '#cbd5e1';
      dropzone.style.background = 'var(--bg-secondary)';
    });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.borderColor = '#cbd5e1';
      dropzone.style.background = 'var(--bg-secondary)';
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        this.activeStudio.setUserPhoto(e.dataTransfer.files[0]);
        this.showToast(t('choosePhoto') + ' OK!');
      }
    });

    // Bind Sample Photo Selectors
    container.querySelectorAll('.sample-avatar-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(btn.getAttribute('data-avatar'));
        if (SAMPLE_AVATARS[idx]) {
          this.activeStudio.setUserPhoto(SAMPLE_AVATARS[idx]);
          this.showToast(t('choosePhoto') + ' OK!');
        }
      });
    });

    document.getElementById('btnResetPos').addEventListener('click', () => this.activeStudio.resetPosition());

      this.activeStudio.setScale(e.target.value / 100);

    brightSlider.addEventListener('input', (e) => {
      this.activeStudio.setFilter('brightness', e.target.value);
      document.getElementById('brightnessVal').textContent = `${e.target.value}%`;
    });

    const contrastSlider = document.getElementById('contrastSlider');
    contrastSlider.addEventListener('input', (e) => {
      this.activeStudio.setFilter('contrast', e.target.value);
      document.getElementById('contrastVal').textContent = `${e.target.value}%`;
    });

    const satSlider = document.getElementById('satSlider');
    satSlider.addEventListener('input', (e) => {
      this.activeStudio.setFilter('saturation', e.target.value);
      document.getElementById('satVal').textContent = `${e.target.value}%`;
    });

    // Download HD Handlers (Top Canvas Card + Bottom Controls Card)
    const handleDownloadHD = async () => {
      const blob = await this.activeStudio.exportHighRes();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tra-frames-${campaign.slug || 'campaign'}-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      const newCount = CampaignService.incrementSupporter(campaign.id);
      const counterEl = document.getElementById('supporterCount');
      if (counterEl) counterEl.textContent = newCount.toLocaleString();

      triggerConfetti();
      this.showToast(t('downloadSuccess'), 'success');
    };

    const btnDownloadTop = document.getElementById('btnDownloadHD');
    if (btnDownloadTop) btnDownloadTop.addEventListener('click', handleDownloadHD);
    const btnDownloadBottom = document.getElementById('btnDownloadHDBottom');
    if (btnDownloadBottom) btnDownloadBottom.addEventListener('click', handleDownloadHD);

    // Copy Caption & Link
    const shareableUrl = this.getShareableLink(campaign);
    const currentUrl = encodeURIComponent(shareableUrl);
    const shareTitle = encodeURIComponent(title);

    const btnCopyCaption = document.getElementById('btnCopyCaption');
    if (btnCopyCaption) {
      btnCopyCaption.addEventListener('click', async () => {

          setTimeout(() => { span.textContent = orig; }, 2000);
        }

    if (btnShareFacebook) {
      btnShareFacebook.addEventListener('click', () => {
        window.open(`https://www.facebook.com/sharer/sharer.php?u=${currentUrl}`, '_blank', 'noopener,noreferrer');
      });
    }
    const btnShareWhatsapp = document.getElementById('btnShareWhatsapp');
    if (btnShareWhatsapp) {
      btnShareWhatsapp.addEventListener('click', () => {
        window.open(`https://api.whatsapp.com/send?text=${shareTitle}%20${currentUrl}`, '_blank', 'noopener,noreferrer');
      });
    }
    const btnShareX = document.getElementById('btnShareX');
    if (btnShareX) {
      btnShareX.addEventListener('click', () => {
        window.open(`https://twitter.com/intent/tweet?url=${currentUrl}&text=${shareTitle}`, '_blank', 'noopener,noreferrer');
      });

  // ==========================================
  // VIEW 3: CAMPAIGN CREATOR
  // ==========================================
  loadCreateView(presetFrameId) {
    this.currentView = 'create';
    const container = document.getElementById('appContent');

    // Route Guard: Require Login to Create or Upload Campaigns
    if (typeof AuthService !== 'undefined' && !AuthService.isAuthenticated()) {
      container.innerHTML = `
        <div class="auth-gate-card">
          <div class="auth-gate-icon">${Icons.lock}</div>
          <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">${t('loginRequiredTitle')}</h2>
          <p style="color: var(--text-secondary); line-height: 1.6; font-size: 0.95rem;">${t('loginRequiredDesc')}</p>
          
          <div style="display: flex; flex-direction: column; gap: 0.85rem; max-width: 360px; margin: 0 auto; width: 100%;">
            <button class="btn-google" id="btnGateGoogle">${Icons.google} <span>${t('signInWithGoogle')}</span></button>
            <button class="btn btn-outline" id="btnGateEmail">${Icons.mail} <span>${t('signInWithEmail')}</span></button>
          </div>
          
          <div style="background: var(--accent-soft); border-radius: var(--radius-md); padding: 0.65rem 1rem; font-size: 0.84rem; color: var(--accent-primary); font-weight: 600; margin-top: 0.5rem;">
            💡 ${t('supporterNoLoginTip')}
          </div>
        </div>
      `;

      document.getElementById('btnGateGoogle').addEventListener('click', async () => {
        try {
          await AuthService.loginWithGoogle();
          this.showToast(t('loginSuccess'), 'success');
          this.loadCreateView(presetFrameId);
        } catch (err) {
          if (err.code === 'auth/unauthorized-domain') {
            this.showToast("Domain មិនទាន់អនុញ្ញាតក្នុង Firebase Console ទេ សូម Add frame.tra4me.com", 'error');
          } else if (err.code !== 'auth/popup-closed-by-user') {
            this.showToast(t('loginFailed'), 'error');
          }
        }
      });

      document.getElementById('btnGateEmail').addEventListener('click', () => {
        this.openAuthModal(() => this.loadCreateView(presetFrameId));
      });
      return;
    }

    let initialFrame = PRESET_FRAMES.graduation;
    if (presetFrameId && PRESET_FRAMES[presetFrameId]) {
      initialFrame = PRESET_FRAMES[presetFrameId];
    } else if (presetFrameId === 'designer' && window._designerExportedFrame) {
      initialFrame = window._designerExportedFrame;
    }

    const defaultCreator = (AuthService && AuthService.currentUser) 
      ? SecurityUtils.escapeHtml(AuthService.currentUser.displayName || AuthService.currentUser.email.split('@')[0])
      : '';

    container.innerHTML = `
      <div style="max-width: 720px; margin: 0 auto;">
        <div style="margin-bottom: 2rem; text-align: center;">
          <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.4rem; color: var(--text-primary);">${t('newCampaignTitle')}</h1>
          <p style="color: var(--text-secondary);">${t('tagline')}</p>
        </div>

        <form id="createCampaignForm" class="studio-controls-card" style="gap: 1.4rem;">
          <div class="form-group">
            <label class="form-label">${t('fieldTitle')} *</label>
            <input type="text" id="campaignTitle" class="form-input" placeholder="${t('fieldTitlePlaceholder')}" required />
          </div>

          <div class="form-row-2col">
            <div class="form-group">
              <label class="form-label">${t('fieldSlug')}</label>
              <input type="text" id="campaignSlug" class="form-input" placeholder="${t('fieldSlugPlaceholder')}" />
            </div>

            <div class="form-group">
              <label class="form-label">${t('fieldCategory')}</label>
              <select id="campaignCategory" class="form-select">
                <option value="education">🎓 ${t('catEducation')}</option>
                <option value="culture">🇰🇭 ${t('catCulture')}</option>
                <option value="charity">❤️ ${t('catCharity')}</option>
                <option value="tech">⚡ ${t('catTech')}</option>
                <option value="celebration">🎉 ${t('catCelebration')}</option>
                <option value="sports">🏆 ${t('catSports')}</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">${t('creator')} / Organization *</label>
            <input type="text" id="campaignCreator" class="form-input" value="${defaultCreator}" placeholder="e.g., Youth Union, Tech Team" required />
          </div>

          <div class="form-group">
            <label class="form-label">${t('fieldDesc')}</label>
            <textarea id="campaignDesc" class="form-textarea" rows="3" placeholder="${t('fieldDescPlaceholder')}"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">${t('fieldCaption')}</label>
            <textarea id="campaignCaption" class="form-textarea" rows="2" placeholder="${t('fieldCaptionPlaceholder')}"></textarea>
          </div>

          <!-- Frame Selection / Upload -->
          <div class="form-group">
            <label class="form-label">${t('fieldFrameUpload')} *</label>
            <div style="display: flex; gap: 1.25rem; align-items: center; flex-wrap: wrap;">
              <div style="width: 120px; height: 120px; border-radius: var(--radius-md); border: 1px solid var(--border-color); overflow: hidden; background: #f1f5f9; display: flex; align-items: center; justify-content: center;">
                <img id="framePreviewImg" src="${initialFrame}" style="width: 100%; height: 100%; object-fit: contain;" />
              </div>
              <div style="flex: 1; display: flex; flex-direction: column; gap: 0.65rem;">
                <input type="file" id="frameFileInput" accept="image/png,image/svg+xml,image/webp" style="display: none;" />
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                  <button type="button" class="btn btn-secondary" onclick="document.getElementById('frameFileInput').click()">
                    ${Icons.upload} <span>Upload PNG</span>
                  </button>
                  <button type="button" class="btn btn-outline" onclick="window.location.hash='#designer'">
                    ${Icons.paint} <span>${t('designerTitle')}</span>
                  </button>
                </div>
                <div style="font-size: 0.8rem; color: var(--text-muted);">${t('frameUploadHint')}</div>
              </div>
            </div>
          </div>

          <!-- Preset Templates Shortcut -->
          <div>
            <div style="font-size: 0.88rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.45rem;">
              ${t('orChooseTemplate')}:
            </div>
            <div style="display: flex; gap: 0.65rem; overflow-x: auto; padding-bottom: 0.5rem;">
              ${Object.keys(PRESET_FRAMES).map(key => `
                <div class="sample-avatar-btn" style="width: 50px; height: 50px; flex-shrink: 0;" data-preset="${key}">
                  <img src="${PRESET_FRAMES[key]}" />
                </div>
              `).join('')}
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="padding: 0.95rem; font-size: 1.05rem; margin-top: 0.5rem;">
            ${Icons.sparkles} <span>${t('publishCampaign')}</span>
          </button>
        </form>
      </div>
    `;

    let selectedFrameDataUrl = initialFrame;

    // Handle File Upload
    const frameFileInput = document.getElementById('frameFileInput');
    frameFileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        const file = e.target.files[0];
        const validation = SecurityUtils.validateImageFile(file);
        if (!validation.valid) {
          this.showToast(validation.error, 'error');
          frameFileInput.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = async (event) => {
          const isKm = getLanguage() === 'km';
          this.showToast(isKm ? 'កំពុងដំណើរការ Optimize រូបភាព...' : 'Optimizing frame image...');
          selectedFrameDataUrl = await CampaignService.compressFrameDataUrl(event.target.result);
          document.getElementById('framePreviewImg').src = selectedFrameDataUrl;
          this.showToast(isKm ? 'បានផ្ទុករូបភាពស៊ុមជោគជ័យ!' : 'Frame uploaded successfully!');
        };
        reader.readAsDataURL(file);
      }
    });

    // Preset Selection
    container.querySelectorAll('[data-preset]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-preset');
        if (PRESET_FRAMES[key]) {
          selectedFrameDataUrl = PRESET_FRAMES[key];
          document.getElementById('framePreviewImg').src = selectedFrameDataUrl;
          this.showToast(`Selected preset: ${key}`);
        }
      });
    });

    // Form Submit
    document.getElementById('createCampaignForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const isKm = getLanguage() === 'km';
      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<span>⏳ ${isKm ? 'កំពុងរក្សាទុក...' : 'Publishing...'}</span>`;
      }

      const title = document.getElementById('campaignTitle').value.trim();
      const slug = document.getElementById('campaignSlug').value.trim();
      const category = document.getElementById('campaignCategory').value;
      const creator = document.getElementById('campaignCreator').value.trim();
      const desc = document.getElementById('campaignDesc').value.trim();
      const caption = document.getElementById('campaignCaption').value.trim();

      const newCampaign = await CampaignService.saveCampaign({
        titleKm: title,
        titleEn: title,
        slug: slug,
        category: category,
        creator: creator,
        descriptionKm: desc,
        descriptionEn: desc,
        captionKm: caption,
        captionEn: caption,
        frameUrl: selectedFrameDataUrl
      });

      this.showToast(t('publishSuccess'), 'success');
      window.location.hash = `#campaign/${newCampaign.slug}`;
    });
  }

  // ==========================================
  // VIEW 4: IN-APP FRAME DESIGNER (CLEAN PREVIEW)
  // ==========================================
  loadDesignerView() {
    this.currentView = 'designer';
    const container = document.getElementById('appContent');

    container.innerHTML = `
      <div style="margin-bottom: 1.25rem;">
        <button class="btn btn-secondary" onclick="window.location.hash='#explore'">
          ${Icons.back} <span>${t('backToHome')}</span>
        </button>
      </div>

      <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.4rem; color: var(--text-primary);">${t('designerTitle')}</h1>
        <p style="color: var(--text-secondary); max-width: 600px; margin: 0 auto;">${t('designerSubtitle')}</p>
      </div>

      <div class="studio-layout">
        <!-- Canvas Left Column -->
        <div class="canvas-wrapper-card">
          <div class="canvas-container" style="max-width: 400px;">
            <canvas id="designerCanvas" width="1000" height="1000"></canvas>
          </div>
          <div style="display: flex; gap: 0.75rem; width: 100%;">
            <button class="btn btn-primary" id="btnUseAsCampaign" style="flex: 1;">
              ${Icons.plus} <span>${t('exportAsFrame')}</span>
            </button>
            <button class="btn btn-secondary" id="btnDownloadDesignerFrame">
              ${Icons.download} <span>PNG</span>
            </button>
          </div>
        </div>

        <!-- Controls Right Column -->
        <div class="studio-controls-card">
          <!-- Shape Selection -->
          <div class="form-group">
            <label class="form-label">${t('cutoutShape')}</label>
            <div class="categories-bar" style="flex-wrap: wrap; margin-bottom: 0;">
              <button class="category-chip active" data-shape="circle">${t('shapeCircle')}</button>
              <button class="category-chip" data-shape="rounded">${t('shapeRounded')}</button>
              <button class="category-chip" data-shape="square">${t('shapeSquare')}</button>
              <button class="category-chip" data-shape="arch">${t('shapeArch')}</button>
              <button class="category-chip" data-shape="octagon">${t('shapeOctagon')}</button>
            </div>
          </div>

          <!-- Theme / Gradient Selection -->
          <div class="form-group">
            <label class="form-label">${t('frameTheme')}</label>
            <div class="categories-bar" style="flex-wrap: wrap; margin-bottom: 0;">
              <button class="category-chip active" data-theme-name="royalBlue">Royal Blue 👑</button>
              <button class="category-chip" data-theme-name="emerald">Emerald 🌿</button>
              <button class="category-chip" data-theme-name="crimson">Crimson Red 🇰🇭</button>
              <button class="category-chip" data-theme-name="sunset">Sunset Orange 🌅</button>
              <button class="category-chip" data-theme-name="midnightGold">Midnight Gold ✨</button>
              <button class="category-chip" data-theme-name="cyberNeon">Cyber Neon ⚡</button>
              <button class="category-chip" data-theme-name="rosePink">Rose Pink 💖</button>
            </div>
          </div>

          <!-- Header Badge Text -->
          <div class="form-group">
            <label class="form-label">${t('badgeText')}</label>
            <input type="text" id="designerHeaderInput" class="form-input" value="CLASS OF 2026" placeholder="${t('badgePlaceholder')}" />
          </div>

          <!-- Footer Badge Text -->
          <div class="form-group">
            <label class="form-label">${t('subBadgeText')}</label>
            <input type="text" id="designerFooterInput" class="form-input" value="CONGRATULATIONS!" placeholder="${t('subBadgePlaceholder')}" />
          </div>
        </div>
      </div>
    `;

    // Initialize Designer
    const canvas = document.getElementById('designerCanvas');
    this.activeDesigner = new FrameDesigner(canvas);

    // Bind Shape Chips
    container.querySelectorAll('[data-shape]').forEach(chip => {
      chip.addEventListener('click', () => {
        container.querySelectorAll('[data-shape]').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        this.activeDesigner.update({ shape: chip.getAttribute('data-shape') });
      });
    });

    // Bind Theme Chips
    container.querySelectorAll('[data-theme-name]').forEach(chip => {
      chip.addEventListener('click', () => {
        container.querySelectorAll('[data-theme-name]').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        this.activeDesigner.update({ theme: chip.getAttribute('data-theme-name') });
      });
    });

    // Inputs
    document.getElementById('designerHeaderInput').addEventListener('input', (e) => {
      this.activeDesigner.update({ headerText: e.target.value });
    });
    document.getElementById('designerFooterInput').addEventListener('input', (e) => {
      this.activeDesigner.update({ footerText: e.target.value });
    });

    // Use As Campaign
    document.getElementById('btnUseAsCampaign').addEventListener('click', () => {
      window._designerExportedFrame = this.activeDesigner.getTransparentPNGDataUrl();
      window.location.hash = '#create/designer';
    });

    // Download PNG
    document.getElementById('btnDownloadDesignerFrame').addEventListener('click', () => {
      const dataUrl = this.activeDesigner.getTransparentPNGDataUrl();
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `custom-frame-${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      this.showToast(t('downloadSuccess'), 'success');
    });
  }

  // ==========================================
  // VIEW 5: MY CAMPAIGNS
  // ==========================================
  loadMyCampaignsView() {
    this.currentView = 'my-campaigns';
    const container = document.getElementById('appContent');

    // Route Guard: Require login to view user campaigns
    if (typeof AuthService !== 'undefined' && !AuthService.isAuthenticated()) {
      container.innerHTML = `
        <div class="auth-gate-card">
          <div class="auth-gate-icon">${Icons.avatar}</div>
          <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--text-primary);">${t('myCampaigns')}</h2>
          <p style="color: var(--text-secondary); line-height: 1.6; font-size: 0.95rem;">${t('loginRequiredDesc')}</p>
          
          <div style="display: flex; flex-direction: column; gap: 0.85rem; max-width: 360px; margin: 0 auto; width: 100%;">
            <button class="btn-google" id="btnMyGateGoogle">${Icons.google} <span>${t('signInWithGoogle')}</span></button>
            <button class="btn btn-outline" id="btnMyGateEmail">${Icons.mail} <span>${t('signInWithEmail')}</span></button>
          </div>
          
          <div style="background: var(--accent-soft); border-radius: var(--radius-md); padding: 0.65rem 1rem; font-size: 0.84rem; color: var(--accent-primary); font-weight: 600; margin-top: 0.5rem;">
            💡 ${t('supporterNoLoginTip')}
          </div>
        </div>
      `;

      document.getElementById('btnMyGateGoogle').addEventListener('click', async () => {
        try {
          await AuthService.loginWithGoogle();
          this.showToast(t('loginSuccess'), 'success');
          this.loadMyCampaignsView();
        } catch (err) {
          if (err.code === 'auth/unauthorized-domain') {
            this.showToast("Domain មិនទាន់អនុញ្ញាតក្នុង Firebase Console ទេ សូម Add frame.tra4me.com", 'error');
          } else if (err.code !== 'auth/popup-closed-by-user') {
            this.showToast(t('loginFailed'), 'error');
          }
        }
      });

      document.getElementById('btnMyGateEmail').addEventListener('click', () => {
        this.openAuthModal(() => this.loadMyCampaignsView());
      });
      return;
    }

    const myCampaigns = CampaignService.getUserCampaigns();

    container.innerHTML = `
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--text-primary);">${t('myCampaigns')}</h1>
          <p style="color: var(--text-secondary); font-size: 0.92rem;">${myCampaigns.length} campaigns created</p>
        </div>
        <button class="btn btn-primary" onclick="window.location.hash='#create'">
          ${Icons.plus} <span>${t('createCampaign')}</span>
        </button>
      </div>

      ${myCampaigns.length === 0 ? `
        <div style="text-align: center; padding: 4rem 1rem; background: var(--bg-card); border-radius: var(--radius-xl); border: 1px solid var(--border-color);">
          <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">🎨</div>
          <h3 style="font-size: 1.15rem; color: var(--text-primary);">${t('noCampaignsYet')}</h3>
          <p style="color: var(--text-secondary); margin: 0.5rem 0 1.25rem 0;">${t('startCreateFirst')}</p>
          <button class="btn btn-primary" onclick="window.location.hash='#create'">
            ${Icons.plus} <span>${t('createCampaign')}</span>
          </button>
        </div>
      ` : `
        <div class="campaign-grid">
          ${myCampaigns.map(c => {
            const safeTitle = SecurityUtils.escapeHtml(c.titleKm || c.titleEn || 'Untitled');
            const safeDate = SecurityUtils.escapeHtml(c.createdAt || '');
            const safeSlug = SecurityUtils.escapeHtml(c.slug || c.id);
            const safeId = SecurityUtils.escapeHtml(c.id);
            const safeFrameUrl = SecurityUtils.sanitizeUrl(c.frameUrl);
            const safeSupporters = (c.supporters || 0).toLocaleString();
            return `
              <div class="campaign-card">
                <div class="card-preview-wrapper" onclick="window.location.hash='#campaign/${safeSlug}'">
                  <img src="${SAMPLE_AVATARS[0]}" class="card-sample-backdrop" alt="Preview backdrop" loading="lazy" />
                  <img src="${safeFrameUrl}" class="card-preview-frame" loading="lazy" />
                  <div class="card-badge-supporters">${Icons.users} <span>${safeSupporters}</span></div>
                </div>
                <div class="card-content">
                  <h3 class="card-title">${safeTitle}</h3>
                  <div class="card-creator">📅 ${safeDate}</div>
                  <div class="card-footer" style="margin-top: 0.75rem; display: flex; gap: 0.5rem;">
                    <button class="btn btn-primary" style="flex: 1;" onclick="window.location.hash='#campaign/${safeSlug}'">
                      ${Icons.camera} <span>${t('viewCampaign')}</span>
                    </button>
                    <button class="btn-icon" style="color: #ef4444;" title="${t('delete')}" onclick="app.deleteUserCampaign('${safeId}')">
                      ${Icons.trash}
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `}
    `;
  }

  deleteUserCampaign(id) {
    if (confirm(t('deleteConfirm'))) {
      CampaignService.deleteCampaign(id);
      this.showToast("Campaign deleted");
      this.loadMyCampaignsView();
    }
  }

  showToast(message, type = 'success') {
    let container = document.getElementById('toastContainer');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toastContainer';
      container.className = 'toast-container';
      document.body.appendChild(container);
    }

    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `
      <span>${type === 'success' ? Icons.check : '!'}</span>
      <span>${message}</span>
    `;

    container.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(10px)';
      toast.style.transition = 'all 0.25s ease';
      setTimeout(() => toast.remove(), 250);
    }, 2800);
  }
}
