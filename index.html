const OtpService = {
  async generateOtp(email, displayName = '') {
    if (!email) throw new Error("Email is required for OTP generation");
    const cleanEmail = email.trim().toLowerCase();
    
    // Rate limit: max 3 requests per 60 seconds
    const rateCheck = SecurityUtils.checkRateLimit(`otp_req_${cleanEmail}`, 3, 60);
    if (!rateCheck.allowed) {
      const isKm = typeof getLanguage === 'function' && getLanguage() === 'km';
      const err = new Error(isKm 
        ? `សូមរង់ចាំ ${rateCheck.waitSeconds} វិនាទីមុននឹងស្នើសុំលេខកូដថ្មី`
        : `Please wait ${rateCheck.waitSeconds}s before requesting a new OTP.`);
      err.code = 'otp/rate-limit';
      throw err;
    }

    // Generate cryptographically random 6-digit number
    let otpCode = '';
    if (window.crypto && window.crypto.getRandomValues) {
      const arr = new Uint32Array(1);
      window.crypto.getRandomValues(arr);
      otpCode = (100000 + (arr[0] % 900000)).toString();
    } else {
      otpCode = Math.floor(100000 + Math.random() * 900000).toString();
    }

    // Hash the OTP with salt for secure storage
    const otpHash = await SecurityUtils.hashPassword(otpCode, `otp_${cleanEmail}`);
    const expiresAt = Date.now() + 10 * 60 * 1000; // 10 minutes

    const record = {
      email: cleanEmail,
      hash: otpHash,
      expiresAt: expiresAt,
      attempts: 0
    };

    try {
      sessionStorage.setItem("tra_otp_record", JSON.stringify(record));
    } catch (e) {}

    // Dispatch email
    await this.sendOtpEmail(cleanEmail, otpCode, displayName);

    return { email: cleanEmail, otpCode, expiresAt };
  },

  async sendOtpEmail(email, otpCode, displayName = '') {
    const cleanEmail = email.trim().toLowerCase();
    const name = displayName || cleanEmail.split('@')[0];

    // Channel 1: EmailJS (if configured)
    if (typeof emailjs !== 'undefined' && window.EMAILJS_CONFIG && window.EMAILJS_CONFIG.publicKey) {
      try {
        await emailjs.send(
          window.EMAILJS_CONFIG.serviceId,
          window.EMAILJS_CONFIG.templateId,
          {
            to_email: cleanEmail,
            otp_code: otpCode,
            user_name: name
          },
          window.EMAILJS_CONFIG.publicKey
        );
        console.log("📩 [EmailJS] OTP sent successfully to", cleanEmail);
      } catch (e) {
        console.warn("EmailJS delivery notice:", e);
      }
    }

    // Channel 2: Firebase Firestore 'mail' collection (Trigger Email extension)
    const db = initFirestore();
    if (db) {
      try {
        db.collection("mail").add({
          to: [cleanEmail],
          message: {
            subject: `Tra Frames - លេខកូដផ្ទៀងផ្ទាត់ OTP របស់អ្នកគឺ៖ ${otpCode}`,
            text: `សួស្តី ${name}!\nលេខកូដសម្ងាត់ ៦ ខ្ទង់របស់អ្នកគឺ៖ ${otpCode}\nលេខកូដនេះមានសុពលភាពរយៈពេល ១០ នាទី។`,
            html: `
              <div style="font-family: Arial, sans-serif; max-width: 500px; margin: 0 auto; padding: 25px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; text-align: center;">
                <h2 style="color: #059669; margin-bottom: 6px;">Tra Frames</h2>
                <p style="color: #64748b; font-size: 14px; margin-top: 0;">វេទិកាស៊ុមរូបថតយុទ្ធនាការ និងព្រឹត្តិការណ៍</p>
                <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 18px 0;">
                <p style="color: #334155; font-size: 15px;">សួស្តី <strong>${name}</strong>,</p>
                <p style="color: #475569; font-size: 14px;">នេះជាលេខកូដផ្ទៀងផ្ទាត់អ៊ីមែល (OTP) របស់អ្នក៖</p>
                <div style="margin: 24px 0;">
                  <span style="font-size: 36px; font-weight: 800; letter-spacing: 8px; color: #0f172a; background: #f0fdf4; padding: 12px 24px; border-radius: 8px; border: 2px dashed #10b981; display: inline-block;">
                    ${otpCode}
                  </span>
                </div>
                <p style="color: #e11d48; font-size: 13px; font-weight: 600;">⚠️ លេខកូដនេះមានសុពលភាពរយៈពេល ១០ នាទីប៉ុណ្ណោះ។</p>
                <p style="color: #94a3b8; font-size: 12px; margin-top: 20px;">ប្រសិនបើអ្នកមិនបានស្នើសុំលេខកូដនេះទេ សូមកុំចែករំលែកវាជាមួយនរណាម្នាក់ឡើយ។</p>
              </div>
            `
          }
        }).then(() => console.log("🔥 [Firestore Mail] Trigger Email queued for", cleanEmail))
          .catch(e => console.warn("Firestore mail queue notice:", e));
      } catch (e) {}
    }

    // Channel 3: Firebase Auth Action Code in background
    const auth = initFirebaseAuth();
    if (auth && auth.currentUser && typeof auth.currentUser.sendEmailVerification === 'function') {
      try {
        auth.currentUser.sendEmailVerification().catch(() => {});
      } catch (e) {}
    }

    // Channel 4: Global notification dispatch
    window.dispatchEvent(new CustomEvent('tra_otp_dispatched', {
      detail: { email: cleanEmail, otpCode }
    }));
    console.log(`%c🔑 [Tra Frames OTP] Code generated for ${cleanEmail}: ${otpCode}`, "color: #059669; font-weight: bold; font-size: 14px;");
  },

  async verifyOtp(email, enteredCode) {
    if (!email || !enteredCode) {
      return { success: false, reason: 'missing_data' };
    }
    const cleanEmail = email.trim().toLowerCase();
    const cleanCode = enteredCode.toString().trim();

    let rawRecord = null;
    try {
      rawRecord = sessionStorage.getItem("tra_otp_record");
    } catch (e) {}

    if (!rawRecord) {
      return { success: false, reason: 'expired' };
    }

    let record = null;
    try {
      record = JSON.parse(rawRecord);
    } catch (e) {
      return { success: false, reason: 'invalid' };
    }

    if (record.email !== cleanEmail) {
      return { success: false, reason: 'email_mismatch' };
    }

    if (Date.now() > record.expiresAt) {
      return { success: false, reason: 'expired' };
    }

    if (record.attempts >= 5) {
      return { success: false, reason: 'max_attempts' };
    }

    const inputHash = await SecurityUtils.hashPassword(cleanCode, `otp_${cleanEmail}`);
    if (inputHash !== record.hash) {
      record.attempts = (record.attempts || 0) + 1;
      try {
        sessionStorage.setItem("tra_otp_record", JSON.stringify(record));
      } catch (e) {}
      return { success: false, reason: 'invalid', remainingAttempts: Math.max(0, 5 - record.attempts) };
    }

    // OTP IS VALID!
    try {
      sessionStorage.removeItem("tra_otp_record");
    } catch (e) {}

    // Update active user state
    if (AuthService.currentUser) {
      AuthService.currentUser.emailVerified = true;
      try {
        localStorage.setItem("tra_active_user", JSON.stringify(AuthService.currentUser));
      } catch (e) {}

      // Update local account database if local
      if (AuthService.currentUser.isLocal) {
        const accounts = AuthService.getLocalAccounts();
        const acc = accounts.find(a => a.email && a.email.toLowerCase() === cleanEmail);
        if (acc) {
          acc.emailVerified = true;
          try {
            localStorage.setItem("tra_local_accounts", JSON.stringify(accounts));
          } catch (e) {}
        }
      }

      // Record in Cloud Firestore verified_users collection
      const db = initFirestore();
      if (db && AuthService.currentUser.uid) {
        try {
          await db.collection("verified_users").doc(AuthService.currentUser.uid).set({
            email: cleanEmail,
            verifiedAt: new Date().toISOString(),
            method: "email_otp"
          }, { merge: true });
          console.log("🔥 [Cloud Verified] User verified in Firestore:", AuthService.currentUser.uid);
        } catch (e) {
          console.warn("Firestore verified_users update notice:", e);
        }
      }

      AuthService.notifyListeners();
    }

    return { success: true };
  }
};

const AuthService = {
  currentUser: null,
  listeners: [],
  initialized: false,

  init() {
    if (this.initialized) return;
    this.initialized = true;

    // 1. Check local session storage first
    try {
      const activeStored = localStorage.getItem("tra_active_user");
      if (activeStored) {
        this.currentUser = JSON.parse(activeStored);
        this.notifyListeners();
      }
    } catch (e) {}

    // 2. Connect to Firebase Auth
    const auth = initFirebaseAuth();
    if (!auth) return;

    auth.onAuthStateChanged((user) => {
      if (user) {
        const isGoogle = user.providerData && user.providerData.some(p => p.providerId === 'google.com');
        this.currentUser = {
          uid: user.uid,
          email: user.email || '',
          displayName: SecurityUtils.cleanText(user.displayName || (user.email ? user.email.split('@')[0] : 'Creator'), 50),
          photoURL: SecurityUtils.sanitizeUrl(user.photoURL || ''),
          emailVerified: isGoogle ? true : !!user.emailVerified,
          isLocal: false
        };

        // Check if verified via OTP in Firestore
        if (!this.currentUser.emailVerified) {
          const db = initFirestore();
          if (db) {
            db.collection("verified_users").doc(user.uid).get().then(doc => {
              if (doc.exists && this.currentUser && this.currentUser.uid === user.uid) {
                this.currentUser.emailVerified = true;
                try { localStorage.setItem("tra_active_user", JSON.stringify(this.currentUser)); } catch (e) {}
                this.notifyListeners();
              }
            }).catch(() => {});
          }
        }

        try {
          localStorage.setItem("tra_active_user", JSON.stringify(this.currentUser));
        } catch (e) {}
      } else {
        if (this.currentUser && !this.currentUser.isLocal) {
          this.currentUser = null;
          try {
            localStorage.removeItem("tra_active_user");
          } catch (e) {}
        }
      }

      console.log("👤 Tra Frames Auth:", this.currentUser ? `Signed in as ${this.currentUser.displayName} (Verified: ${this.isEmailVerified()})` : "Guest");
      this.notifyListeners();
    });
  },

  onAuthStateChanged(callback) {
    this.listeners.push(callback);
    callback(this.currentUser);
  },

  notifyListeners() {
    this.listeners.forEach(cb => {
      try { cb(this.currentUser); } catch (e) { console.error(e); }
    });
  },

  isAuthenticated() {
    return !!this.currentUser;
  },

  isEmailVerified() {
    if (!this.currentUser) return false;
    if (this.currentUser.emailVerified === true) return true;
    if (this.currentUser.isLocal && this.currentUser.emailVerified !== false) return true;
    return false;
  },

  async checkEmailVerificationStatus() {
    const auth = initFirebaseAuth();
    if (auth && auth.currentUser) {
      try {
        await auth.currentUser.reload();
        const isGoogle = auth.currentUser.providerData && auth.currentUser.providerData.some(p => p.providerId === 'google.com');
        let isVerified = isGoogle || !!auth.currentUser.emailVerified;
        if (!isVerified) {
          const db = initFirestore();
          if (db) {
            try {
              const doc = await db.collection("verified_users").doc(auth.currentUser.uid).get();
              if (doc.exists) isVerified = true;
            } catch (e) {}
          }
        }
        if (this.currentUser) {
          this.currentUser.emailVerified = isVerified;
          try { localStorage.setItem("tra_active_user", JSON.stringify(this.currentUser)); } catch (e) {}
          this.notifyListeners();
        }
        return isVerified;
      } catch (err) {
        console.warn("reload user error:", err);
      }
    }
    if (this.currentUser && this.currentUser.isLocal) {
      return this.currentUser.emailVerified !== false;
    }
    return false;
  },

  async resendVerificationEmail() {
    const rateCheck = SecurityUtils.checkRateLimit('resend_email_verification', 1, 60);
    if (!rateCheck.allowed) {
      const err = new Error(`សូមរង់ចាំ ${rateCheck.waitSeconds} វិនាទីមុននឹងផ្ញើម្តងទៀត`);
      err.code = 'auth/too-many-requests';
      throw err;
    }
    const auth = initFirebaseAuth();
    if (auth && auth.currentUser) {
      if (typeof auth.currentUser.sendEmailVerification === 'function') {
        await auth.currentUser.sendEmailVerification();
        return true;
      }
    }
    return false;
  },

  async loginWithGoogle() {
    const auth = initFirebaseAuth();
    if (!auth) throw new Error("Firebase Auth is not available.");
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.addScope('profile');
    provider.addScope('email');
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
      const result = await auth.signInWithPopup(provider);
      if (result.user) {
        this.currentUser = {
          uid: result.user.uid,
          email: result.user.email || '',
          displayName: SecurityUtils.cleanText(result.user.displayName || (result.user.email ? result.user.email.split('@')[0] : 'Creator'), 50),
          photoURL: SecurityUtils.sanitizeUrl(result.user.photoURL || ''),
          emailVerified: true,
          isLocal: false
        };
        try { localStorage.setItem("tra_active_user", JSON.stringify(this.currentUser)); } catch (e) {}
        this.notifyListeners();
      }
      return result.user;
    } catch (err) {
      console.error("Google Sign-In Error:", err);
      throw err;
    }
  },

  async loginWithEmail(email, password) {
    if (!email || !password || typeof email !== 'string' || typeof password !== 'string') {
      const err = new Error("Invalid credentials provided");
      err.code = 'auth/invalid-credential';
      throw err;
    }
    const cleanEmail = email.trim().toLowerCase();

    // Anti-Brute Force Protection: max 5 attempts per minute per email
    const rateCheck = SecurityUtils.checkRateLimit(`login_${cleanEmail}`, 5, 60);
    if (!rateCheck.allowed) {
      const err = new Error(`Too many failed attempts. Please wait ${rateCheck.waitSeconds}s.`);
      err.code = 'auth/too-many-requests';
      throw err;
    }

    const auth = initFirebaseAuth();
    if (auth) {
      try {
        const result = await auth.signInWithEmailAndPassword(cleanEmail, password);
        if (result.user) {
          const isGoogle = result.user.providerData && result.user.providerData.some(p => p.providerId === 'google.com');
          let verified = isGoogle || !!result.user.emailVerified;
          
          if (!verified) {
            const db = initFirestore();
            if (db) {
              try {
                const doc = await db.collection("verified_users").doc(result.user.uid).get();
                if (doc.exists) verified = true;
              } catch (e) {}
            }
          }

          this.currentUser = {
            uid: result.user.uid,
            email: result.user.email,
            displayName: SecurityUtils.cleanText(result.user.displayName || (result.user.email ? result.user.email.split('@')[0] : 'Creator'), 50),
            photoURL: SecurityUtils.sanitizeUrl(result.user.photoURL || ''),
            emailVerified: verified,
            isLocal: false
          };
          try { localStorage.setItem("tra_active_user", JSON.stringify(this.currentUser)); } catch (e) {}
          this.notifyListeners();
          return this.currentUser;
        }
      } catch (err) {
        console.warn("Firebase Email Login Notice:", err);
        // If Firebase Console has provider disabled or account is local, check local accounts
        if (err.code === 'auth/operation-not-allowed' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          const local = await this.loginLocal(cleanEmail, password);
          if (local) return local;
        }
        throw err;
      }
    }
    return await this.loginLocal(cleanEmail, password);
  },

  async signUpWithEmail(email, password, displayName) {
    if (!email || !password || typeof email !== 'string' || typeof password !== 'string') {
      const err = new Error("Email and password are required");
      err.code = 'auth/invalid-credential';
      throw err;
    }
    const cleanEmail = email.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
      const err = new Error("Invalid email format");
      err.code = 'auth/invalid-email';
      throw err;
    }
    if (SecurityUtils.isDisposableEmail(cleanEmail)) {
      const err = new Error("Disposable or temporary email addresses are not allowed.");
      err.code = 'auth/disposable-email';
      throw err;
    }
    if (password.length < 6 || password.length > 128) {
      const err = new Error("Password must be between 6 and 128 characters");
      err.code = 'auth/weak-password';
      throw err;
    }
    const safeDisplayName = SecurityUtils.cleanText(displayName || cleanEmail.split('@')[0] || 'Creator', 50);

    const auth = initFirebaseAuth();
    if (auth) {
      try {
        const result = await auth.createUserWithEmailAndPassword(cleanEmail, password);
        if (safeDisplayName && result.user) {
          try { await result.user.updateProfile({ displayName: safeDisplayName }); } catch (e) {}
        }

        // Send Email Verification link in background
        let emailSent = false;
        if (result.user && typeof result.user.sendEmailVerification === 'function') {
          try {
            await result.user.sendEmailVerification();
            emailSent = true;
            console.log("📩 Verification email dispatched to:", cleanEmail);
          } catch (verErr) {
            console.warn("sendEmailVerification notice:", verErr);
          }
        }

        this.currentUser = {
          uid: result.user.uid,
          email: result.user.email,
          displayName: safeDisplayName,
          photoURL: SecurityUtils.sanitizeUrl(result.user.photoURL || ''),
          emailVerified: false,
          verificationEmailSent: emailSent,
          isLocal: false
        };
        try { localStorage.setItem("tra_active_user", JSON.stringify(this.currentUser)); } catch (e) {}

        // Dispatch 6-digit OTP code to email
        try {
          await OtpService.generateOtp(cleanEmail, safeDisplayName);
        } catch (otpErr) {
          console.warn("OTP dispatch notice:", otpErr);
        }

        this.notifyListeners();
        return this.currentUser;
      } catch (err) {
        console.warn("Firebase Cloud Sign-Up Notice:", err);
        // If Firebase Console has Email/Password disabled (OPERATION_NOT_ALLOWED), fallback to seamless Local Account!
        if (err.code === 'auth/operation-not-allowed' || err.code === 'auth/network-request-failed') {
          return await this.signUpLocal(cleanEmail, password, safeDisplayName);
        }
        throw err;
      }
    }
    return await this.signUpLocal(cleanEmail, password, safeDisplayName);
  },

  async signUpLocal(email, password, displayName) {
    const cleanEmail = email.trim().toLowerCase();
    const accounts = this.getLocalAccounts();
    const existing = accounts.find(a => a.email && a.email.toLowerCase() === cleanEmail);
    if (existing) {
      const err = new Error("Email already registered");
      err.code = 'auth/email-already-in-use';
      throw err;
    }

    const uid = "local-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);
    const safeDisplayName = SecurityUtils.cleanText(displayName || cleanEmail.split('@')[0] || 'Creator', 50);
    const passwordHash = await SecurityUtils.hashPassword(password, uid);

    const user = {
      uid: uid,
      email: cleanEmail,
      displayName: safeDisplayName,
      photoURL: '',
      emailVerified: false,
      isLocal: true
    };

    accounts.push({ ...user, passwordHash });
    try {
      localStorage.setItem("tra_local_accounts", JSON.stringify(accounts));
    } catch (e) {}
    this.currentUser = user;
    try {
      localStorage.setItem("tra_active_user", JSON.stringify(user));
    } catch (e) {}

    // Dispatch 6-digit OTP code to email
    try {
      await OtpService.generateOtp(cleanEmail, safeDisplayName);
    } catch (otpErr) {
      console.warn("OTP dispatch notice:", otpErr);
    }

    this.notifyListeners();
    return user;
  },

  async loginLocal(email, password) {
    const cleanEmail = email.trim().toLowerCase();
    const accounts = this.getLocalAccounts();
    const found = accounts.find(a => a.email && a.email.toLowerCase() === cleanEmail);
    if (!found) {
      const err = new Error("Invalid email or password");
      err.code = 'auth/invalid-credential';
      throw err;
    }

    // Verify SHA-256 hash with salt
    const expectedHash = await SecurityUtils.hashPassword(password, found.uid);
    let isMatch = (found.passwordHash === expectedHash);

    // Backward compatibility: upgrade legacy base64 password to SHA-256 on successful login
    if (!isMatch && found.passwordHash === btoa(encodeURIComponent(password))) {
      isMatch = true;
      found.passwordHash = expectedHash;
      try {
        localStorage.setItem("tra_local_accounts", JSON.stringify(accounts));
      } catch (e) {}
    }

    if (!isMatch) {
      const err = new Error("Invalid email or password");
      err.code = 'auth/invalid-credential';
      throw err;
    }

    const user = {
      uid: found.uid,
      email: found.email,
      displayName: SecurityUtils.cleanText(found.displayName, 50),
      photoURL: SecurityUtils.sanitizeUrl(found.photoURL || ''),
      isLocal: true
    };
    this.currentUser = user;
    try {
      localStorage.setItem("tra_active_user", JSON.stringify(user));
    } catch (e) {}
    this.notifyListeners();
    return user;
  },

  getLocalAccounts() {
    try {
      const stored = localStorage.getItem("tra_local_accounts");
      return stored ? JSON.parse(stored) : [];
    } catch (e) {
      return [];
    }
  },

  async logout() {
    this.currentUser = null;
    try {
      localStorage.removeItem("tra_active_user");
    } catch (e) {}
    const auth = initFirebaseAuth();
    if (auth) {
      try {
        await auth.signOut();
      } catch (e) {}
    }
    this.notifyListeners();
  }
};

const CampaignService = {
  _memoryCache: new Map(),

  getCampaigns() {
    let userCampaigns = [];
    try {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (stored) {
        userCampaigns = JSON.parse(stored);
      }
    } catch (e) {
      console.error("Failed to load user campaigns from localStorage:", e);
    }
    const combined = [...userCampaigns];
    if (this._memoryCache) {
      for (const [id, c] of this._memoryCache.entries()) {
        if (!combined.some(existing => existing.slug === c.slug || existing.id === c.id)) {
          combined.unshift(c);
        }
      }
    }
    return [...combined, ...INITIAL_CAMPAIGNS];
  },

  getCampaignBySlugOrId(identifier) {
    if (!identifier) return null;
    if (this._memoryCache && this._memoryCache.has(identifier)) {
      return this._memoryCache.get(identifier);
    }
    const all = this.getCampaigns();
    return all.find(c => c.slug === identifier || c.id === identifier);
  },

  async compressFrameDataUrl(dataUrl, maxDim = 1080) {
    if (!dataUrl || typeof dataUrl !== 'string') return dataUrl;
    if (!dataUrl.startsWith('data:image')) return dataUrl;
    if (dataUrl.startsWith('data:image/svg+xml')) return dataUrl;

    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          let width = img.naturalWidth || img.width;
          let height = img.naturalHeight || img.height;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          // Try WebP first (supports alpha transparency and is 3-5x smaller than PNG)
          try {
            const webpUrl = canvas.toDataURL('image/webp', 0.85);
            if (webpUrl && webpUrl.startsWith('data:image/webp') && webpUrl.length < 800000) {
              return resolve(webpUrl);
            }
          } catch (e) {}

          // Fallback to PNG (guaranteed lossless transparency)
          const pngUrl = canvas.toDataURL('image/png');
          if (pngUrl.length < 900000) {
            return resolve(pngUrl);
          }

          // If still larger than 900KB, scale down slightly to 900x900 PNG
          canvas.width = Math.min(width, 900);
          canvas.height = Math.min(height, 900);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          return resolve(canvas.toDataURL('image/png'));
        } catch (err) {
          console.warn('Image compression exception, using original:', err);
          resolve(dataUrl);
        }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  },

  async saveCampaign(campaignData) {
    // 1. Rate Limiting: max 5 campaign creations per 60 seconds per user
    const rateCheck = SecurityUtils.checkRateLimit('create_campaign', 5, 60);
    if (!rateCheck.allowed) {
      throw new Error(`Rate limit exceeded. Please wait ${rateCheck.waitSeconds}s before publishing again.`);
    }

    let userCampaigns = [];
    try {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (stored) userCampaigns = JSON.parse(stored);
    } catch (e) {
      userCampaigns = [];
    }

    // 2. Strict Slug Validation (lowercase alphanumeric and hyphens only, max 60 chars)
    const rawSlug = typeof campaignData.slug === 'string' ? campaignData.slug : (campaignData.titleEn || "campaign");
    const safeSlug = rawSlug
      .toLowerCase()
      .replace(/[^a-z0-9-]+/g, "")
      .replace(/^-+|-+$/g, "")
      .slice(0, 60) || "campaign-" + Date.now();

    // 3. Frame URL Sanitization and Compression
    let frameUrl = SecurityUtils.sanitizeUrl(campaignData.frameUrl);
    if (!frameUrl || frameUrl === '#' || frameUrl.length > 3000000) {
      throw new Error("Invalid or excessively large frame image provided.");
    }
    if (frameUrl && frameUrl.length > 650000) {
      try {
        frameUrl = await this.compressFrameDataUrl(frameUrl);
      } catch (e) {}
    }

    const user = AuthService.currentUser;
    if (user && !AuthService.isEmailVerified()) {
      const isKm = typeof getLanguage === 'function' && getLanguage() === 'km';
      throw new Error(isKm 
        ? "សូមផ្ទៀងផ្ទាត់អ៊ីមែលរបស់អ្នកជាមុនសិន ទើបអាចបង្កើតយុទ្ធនាការបាន" 
        : "Email verification required. Please verify your email before publishing campaigns.");
    }
    const allowedCategories = ['education', 'culture', 'charity', 'sports', 'tech', 'celebration'];
    const safeCategory = allowedCategories.includes(campaignData.category) ? campaignData.category : 'celebration';

    // 4. Strict Whitelist Construction (Anti-Prototype Pollution & Field Injection)
    const rawId = typeof campaignData.id === 'string' ? campaignData.id.replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 64) : '';
    const newCampaign = {
      id: rawId || "user-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
      creatorUid: user ? user.uid : null,
      creatorEmail: user ? user.email : null,
      titleKm: SecurityUtils.cleanText(campaignData.titleKm || '', 120),
      titleEn: SecurityUtils.cleanText(campaignData.titleEn || '', 120),
      slug: safeSlug,
      category: safeCategory,
      creator: SecurityUtils.cleanText(campaignData.creator || (user ? user.displayName : 'Anonymous'), 80),
      descriptionKm: SecurityUtils.cleanText(campaignData.descriptionKm || '', 1000),
      descriptionEn: SecurityUtils.cleanText(campaignData.descriptionEn || '', 1000),
      captionKm: SecurityUtils.cleanText(campaignData.captionKm || campaignData.caption || '', 1000),
      captionEn: SecurityUtils.cleanText(campaignData.captionEn || campaignData.caption || '', 1000),
      frameUrl: frameUrl,
      supporters: Math.max(1, Math.min(10000000, parseInt(campaignData.supporters, 10) || 1)),
      createdAt: new Date().toISOString().split("T")[0],
      isUserCreated: true
    };

    userCampaigns.unshift(newCampaign);
    try {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userCampaigns));
    } catch (err) {
      console.warn("Storage quota exceeded, removing oldest custom campaigns:", err);
      if (userCampaigns.length > 1) {
        userCampaigns.pop();
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userCampaigns));
        } catch (e2) {}
      }
    }

    // Save to Cloud Firestore so it is instantly accessible worldwide
    const db = initFirestore();
    if (db) {
      db.collection("campaigns").doc(newCampaign.slug || newCampaign.id).set(newCampaign)
        .then(() => console.log("🔥 Campaign synced to Cloud Firestore:", newCampaign.slug))
        .catch(err => console.warn("Cloud Firestore sync error:", err));
    }

    return newCampaign;
  },

  // Sync a single campaign to Cloud Firestore
  async syncSingleCampaignToCloud(campaign) {
    const db = initFirestore();
    if (!db || !campaign) return false;
    const docId = campaign.slug || campaign.id;
    if (!docId) return false;

    try {
      let dataToSave = { ...campaign };
      if (dataToSave.frameUrl && dataToSave.frameUrl.length > 650000) {
        dataToSave.frameUrl = await this.compressFrameDataUrl(dataToSave.frameUrl);
      }
      await db.collection("campaigns").doc(docId).set(dataToSave, { merge: true });
      console.log("🔥 Synced campaign to Cloud Firestore:", docId);
      const cloudStatusEl = document.getElementById('cloudSyncStatus');
      if (cloudStatusEl) {
        const isKm = getLanguage() === 'km';
        cloudStatusEl.innerHTML = `☁️ ${isKm ? 'បាន Sync ឡើង Cloud Firestore រួចរាល់ • អាចបើកលើទូរស័ព្ទបាន' : 'Synced to Cloud Firestore • Accessible on Mobile'}`;
        cloudStatusEl.style.color = '#10b981';
      }
      return true;
    } catch (err) {
      console.warn("Failed syncing single campaign to Firestore:", docId, err);
      return false;
    }
  },

  parseFirestoreDoc(doc) {
    if (!doc || !doc.fields) return null;
    const result = {};
    for (const [key, val] of Object.entries(doc.fields)) {
      if (val.stringValue !== undefined) result[key] = val.stringValue;
      else if (val.integerValue !== undefined) result[key] = parseInt(val.integerValue, 10);
      else if (val.doubleValue !== undefined) result[key] = parseFloat(val.doubleValue);
      else if (val.booleanValue !== undefined) result[key] = val.booleanValue;
      else if (val.timestampValue !== undefined) result[key] = val.timestampValue;
      else if (val.nullValue !== undefined) result[key] = null;
    }
    return result;
  },

  // Save to memory cache and local storage so subsequent loads are instant
  cacheCloudCampaign(campaign) {
    if (!campaign) return;
    if (campaign.slug) this._memoryCache.set(campaign.slug, campaign);
    if (campaign.id) this._memoryCache.set(campaign.id, campaign);
    try {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      let userCampaigns = stored ? JSON.parse(stored) : [];
      const idx = userCampaigns.findIndex(c => c.slug === campaign.slug || c.id === campaign.id);
      if (idx >= 0) {
        userCampaigns[idx] = campaign;
      } else {
        userCampaigns.unshift(campaign);
      }
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userCampaigns));
    } catch (e) {
      console.warn("Storage quota warning on cacheCloudCampaign:", e);
    }
  },

  // Fetch campaign from Cloud Firestore (SDK + High-Reliability REST fallback)
  async fetchCloudCampaign(identifier) {
    if (!identifier) return null;

    // Check memory cache first
    if (this._memoryCache && this._memoryCache.has(identifier)) {
      return this._memoryCache.get(identifier);
    }

    // 1. Try Firebase SDK if available
    const db = initFirestore();
    if (db) {
      try {
        const docRef = await db.collection("campaigns").doc(identifier).get();
        if (docRef.exists) {
          const data = docRef.data();
          this.cacheCloudCampaign(data);
          return data;
        }

        const snapshot = await db.collection("campaigns").where("slug", "==", identifier).limit(1).get();
        if (!snapshot.empty) {
          const data = snapshot.docs[0].data();
          this.cacheCloudCampaign(data);
          return data;
        }

        const idSnapshot = await db.collection("campaigns").where("id", "==", identifier).limit(1).get();
        if (!idSnapshot.empty) {
          const data = idSnapshot.docs[0].data();
          this.cacheCloudCampaign(data);
          return data;
        }
      } catch (err) {
        console.warn("Firestore SDK notice, switching to direct REST lookup:", err);
      }
    }

    // 2. High-speed Direct REST Fallback (Works 100% reliably on all mobile networks without auth)
    try {
      const restUrl = `https://firestore.googleapis.com/v1/projects/tra-frames/databases/(default)/documents/campaigns/${encodeURIComponent(identifier)}`;
      const res = await fetch(restUrl);
      if (res.ok) {
        const docJson = await res.json();
        const data = this.parseFirestoreDoc(docJson);
        if (data) {
          this.cacheCloudCampaign(data);
          return data;
        }
      }
    } catch (restErr) {
      console.warn("Firestore REST direct lookup error:", restErr);
    }

    return null;
  },

  // Fetch all public campaigns from Cloud Firestore to populate Explore feed
  async fetchAllCloudCampaigns() {
    try {
      const restUrl = `https://firestore.googleapis.com/v1/projects/tra-frames/databases/(default)/documents/campaigns`;
      const res = await fetch(restUrl);
      if (res.ok) {
        const json = await res.json();
        if (json.documents && Array.isArray(json.documents)) {
          const campaigns = json.documents.map(d => this.parseFirestoreDoc(d)).filter(Boolean);
          campaigns.forEach(c => this.cacheCloudCampaign(c));
          return campaigns;
        }
      }
    } catch (err) {
      console.warn("fetchAllCloudCampaigns notice:", err);
    }
    return [];
  },

  // Sync existing local campaigns to Cloud Firestore
  async syncLocalCampaignsToCloud() {
    const db = initFirestore();
    if (!db) return;
    try {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (!stored) return;
      const userCampaigns = JSON.parse(stored);
      let updatedAny = false;
      for (let i = 0; i < userCampaigns.length; i++) {
        let c = userCampaigns[i];
        const docId = c.slug || c.id;
        if (!docId) continue;

        let toSync = { ...c };
        if (toSync.frameUrl && toSync.frameUrl.length > 650000) {
          try {
            toSync.frameUrl = await this.compressFrameDataUrl(toSync.frameUrl);
            userCampaigns[i] = toSync;
            updatedAny = true;
          } catch (e) {}
        }

        try {
          await db.collection("campaigns").doc(docId).set(toSync, { merge: true });
          console.log("🔥 Synced local campaign to Cloud:", docId);
        } catch (e) {
          console.warn("Failed syncing campaign:", docId, e);
        }
      }
      if (updatedAny) {
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userCampaigns));
        } catch (e) {}
      }
    } catch (err) {
      console.warn("Sync to cloud error:", err);
    }
  },

  async deleteCampaign(id) {
    if (!id || typeof id !== 'string') return false;
    const safeId = id.trim();
    try {
      const user = AuthService.currentUser;
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (stored) {
        let userCampaigns = JSON.parse(stored);
        const target = userCampaigns.find(c => c.id === safeId || c.slug === safeId);
        // IDOR Protection: Verify caller is owner of this campaign
        if (target && target.creatorUid && user && target.creatorUid !== user.uid) {
          console.warn("Unauthorized attempt to delete campaign:", safeId);
          return false;
        }

        userCampaigns = userCampaigns.filter(c => c.id !== safeId && c.slug !== safeId);
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userCampaigns));

        // Delete from Cloud Firestore if authorized
        const db = initFirestore();
        if (db && target) {
          const docId = target.slug || target.id;
          db.collection("campaigns").doc(docId).delete()
            .then(() => console.log("🔥 Cloud campaign deleted:", docId))
            .catch(err => console.warn("Cloud Firestore delete notice:", err));
        }
        return true;
      }
    } catch (e) {
      console.error("Failed to delete campaign:", e);
    }
    return false;
  },

  getUserCampaigns() {
    try {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      const allUserCampaigns = stored ? JSON.parse(stored) : [];
      const user = AuthService.currentUser;
      if (user) {
        return allUserCampaigns.filter(c => !c.creatorUid || c.creatorUid === user.uid);
      }
      return allUserCampaigns;
    } catch (e) {
      return [];
    }
  },

  incrementSupporter(id) {
    if (!id) return 1;
    const safeId = String(id).replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 64);
    if (!safeId) return 1;

    // Rate Limiting / Anti-Spam: max 1 vote per campaign per 24 hours per client
    const rateCheck = SecurityUtils.checkRateLimit(`vote_${safeId}`, 1, 86400);
    const all = this.getCampaigns();
    const item = all.find(c => c.id === safeId || c.slug === safeId);

    if (!rateCheck.allowed) {
      // User has already supported recently, return current count without duplicate increment
      return item ? item.supporters : 1;
    }

    if (item) {
      item.supporters = (item.supporters || 0) + 1;
      // If it's in user campaigns, update it locally
      try {
        const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (stored) {
          let userCampaigns = JSON.parse(stored);
          const userIdx = userCampaigns.findIndex(c => c.id === safeId || c.slug === safeId);
          if (userIdx !== -1) {
            userCampaigns[userIdx].supporters = (userCampaigns[userIdx].supporters || 0) + 1;
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userCampaigns));
          }
        }
      } catch (e) {}

      // Atomic Cloud Increment (Safe against race conditions and concurrent votes)
      const db = initFirestore();
      if (db && (item.slug || item.id)) {
        const docId = item.slug || item.id;
        try {
          if (typeof firebase !== 'undefined' && firebase.firestore && firebase.firestore.FieldValue) {
            db.collection("campaigns").doc(docId).update({
              supporters: firebase.firestore.FieldValue.increment(1)
            }).catch(() => {});
          }
        } catch (e) {}
      }

      return item.supporters;
    }
    return 1;
  }
};


// High-Performance Interactive HTML5 Canvas Studio for Twibbon Framing

class CanvasStudio {
  constructor(canvasElement, options = {}) {
    this.canvas = canvasElement;
    this.ctx = canvasElement.getContext('2d');
    this.outputResolution = options.resolution || 1080; // 1080x1080 HD
    
    // Layers
    this.userImage = null;
    this.frameImage = null;

    // Transform State
    this.state = {
      x: 0,
      y: 0,
      scale: 1,
      baseScale: 1,
      rotation: 0,
      flipH: 1,
      flipV: 1,
      // Filters
      brightness: 100,
      contrast: 100,
      saturation: 100,
      sepia: 0,
      grayscale: 0
    };

    // Interaction tracking
    this.isDragging = false;
    this.dragStartX = 0;
    this.dragStartY = 0;
    this.lastPinchDistance = null;

    // Callbacks
    this.onStateChange = options.onStateChange || null;
    this.onPhotoLoaded = options.onPhotoLoaded || null;

    this.initEvents();
  }

  setFrame(sourceUrl) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      if (!sourceUrl.startsWith('data:')) {
        img.crossOrigin = "anonymous";
      }
      img.onload = () => {
        this.frameImage = img;
        this.render();
        resolve();
      };
      img.onerror = (e) => {
        console.error("Failed to load frame image", e);
        reject(e);
      };
      img.src = sourceUrl;
    });
  }

  setUserPhoto(sourceUrlOrFile) {
    return new Promise((resolve, reject) => {
      if (typeof sourceUrlOrFile === 'string') {
        const img = new Image();
        if (!sourceUrlOrFile.startsWith('data:')) {
          img.crossOrigin = "anonymous";
        }
        img.onload = () => {
          this.userImage = img;
          this.fitPhotoToCanvas();
          this.render();
          if (this.onPhotoLoaded) this.onPhotoLoaded();
          resolve();
        };
        img.onerror = reject;
        img.src = sourceUrlOrFile;
      } else if (sourceUrlOrFile instanceof File || sourceUrlOrFile instanceof Blob) {
        if (typeof SecurityUtils !== 'undefined' && sourceUrlOrFile instanceof File) {
          const check = SecurityUtils.validateImageFile(sourceUrlOrFile);
          if (!check.valid) {
            reject(new Error(check.error));
            return;
          }
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            this.userImage = img;
            this.fitPhotoToCanvas();
            this.render();
            if (this.onPhotoLoaded) this.onPhotoLoaded();
            resolve();
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(sourceUrlOrFile);
      }
    });
  }

  fitPhotoToCanvas() {
    if (!this.userImage) return;
    const cw = this.canvas.width;
    const ch = this.canvas.height;
    const iw = this.userImage.width;
    const ih = this.userImage.height;

    // Calculate scale to cover canvas smoothly
    const scaleX = cw / iw;
    const scaleY = ch / ih;
    this.state.baseScale = Math.max(scaleX, scaleY);
    this.state.scale = 1;
    this.state.x = 0;
    this.state.y = 0;
    this.state.rotation = 0;
    this.state.flipH = 1;
    this.state.flipV = 1;
    this.resetFilters();
    this.notifyChange();
  }

  resetFilters() {
    this.state.brightness = 100;
    this.state.contrast = 100;
    this.state.saturation = 100;
    this.state.sepia = 0;
    this.state.grayscale = 0;
    this.notifyChange();
  }

  resetPosition() {
    this.state.x = 0;
    this.state.y = 0;
    this.state.scale = 1;
    this.state.rotation = 0;
    this.state.flipH = 1;
    this.state.flipV = 1;
    this.render();
    this.notifyChange();
  }

  setScale(val) {
    this.state.scale = Math.min(Math.max(val, 0.2), 4.0);
    this.render();
    this.notifyChange();
  }

  setRotation(deg) {
    this.state.rotation = (deg % 360 + 360) % 360;
    this.render();
    this.notifyChange();
  }

  rotate90() {
    this.setRotation(this.state.rotation + 90);
  }

  toggleFlipH() {
    this.state.flipH *= -1;
    this.render();
    this.notifyChange();
  }

  toggleFlipV() {
    this.state.flipV *= -1;
    this.render();
    this.notifyChange();
  }

  setFilter(name, value) {
    if (this.state.hasOwnProperty(name)) {
      this.state[name] = value;
      this.render();
      this.notifyChange();
    }
  }

  notifyChange() {
    if (this.onStateChange) {
      this.onStateChange({ ...this.state });
    }
  }

  initEvents() {
    const el = this.canvas;

    // Mouse Drag Events
    el.addEventListener('mousedown', (e) => {
      if (!this.userImage) return;
      this.isDragging = true;
      const rect = el.getBoundingClientRect();
      const scaleCoord = this.canvas.width / rect.width;
      this.dragStartX = e.clientX * scaleCoord - this.state.x;
      this.dragStartY = e.clientY * scaleCoord - this.state.y;
      el.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
      if (!this.isDragging || !this.userImage) return;
      const rect = el.getBoundingClientRect();
      const scaleCoord = this.canvas.width / rect.width;
      this.state.x = e.clientX * scaleCoord - this.dragStartX;
      this.state.y = e.clientY * scaleCoord - this.dragStartY;
      this.render();
      this.notifyChange();
    });

    window.addEventListener('mouseup', () => {
      if (this.isDragging) {
        this.isDragging = false;
        el.style.cursor = 'grab';
      }
    });

    // Mouse Wheel Zoom
    el.addEventListener('wheel', (e) => {
      if (!this.userImage) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
      this.setScale(this.state.scale * zoomFactor);
    }, { passive: false });

    // Touch Drag & Pinch Zoom Events
    el.addEventListener('touchstart', (e) => {
      if (!this.userImage) return;
      e.preventDefault();
      if (e.touches.length === 1) {
        this.isDragging = true;
        const rect = el.getBoundingClientRect();
        const scaleCoord = this.canvas.width / rect.width;
        this.dragStartX = e.touches[0].clientX * scaleCoord - this.state.x;
        this.dragStartY = e.touches[0].clientY * scaleCoord - this.state.y;
      } else if (e.touches.length === 2) {
        this.isDragging = false;
        this.lastPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: false });

    el.addEventListener('touchmove', (e) => {
      if (!this.userImage) return;
      e.preventDefault();
      if (e.touches.length === 1 && this.isDragging) {
        const rect = el.getBoundingClientRect();
        const scaleCoord = this.canvas.width / rect.width;
        this.state.x = e.touches[0].clientX * scaleCoord - this.dragStartX;
        this.state.y = e.touches[0].clientY * scaleCoord - this.dragStartY;
        this.render();
        this.notifyChange();
      } else if (e.touches.length === 2 && this.lastPinchDistance) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / this.lastPinchDistance;
        this.setScale(this.state.scale * factor);
        this.lastPinchDistance = dist;
      }
    }, { passive: false });

    el.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        this.lastPinchDistance = null;
      }
      if (e.touches.length === 1 && this.userImage) {
        this.isDragging = true;
        const rect = el.getBoundingClientRect();
        const scaleCoord = this.canvas.width / rect.width;
        this.dragStartX = e.touches[0].clientX * scaleCoord - this.state.x;
        this.dragStartY = e.touches[0].clientY * scaleCoord - this.state.y;
      } else if (e.touches.length === 0) {
        this.isDragging = false;
      }
    });
  }

  getFilterString() {
    const { brightness, contrast, saturation, sepia, grayscale } = this.state;
    return `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%) sepia(${sepia}%) grayscale(${grayscale}%)`;
  }

  renderToContext(ctx, width, height, isExport = false) {
    // 1. Clear background
    ctx.clearRect(0, 0, width, height);

    // If not export and no photo, draw helpful placeholder
    if (!this.userImage && !isExport) {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 0, width, height);

      // Draw subtle grid
      ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
      ctx.lineWidth = 2;
      const step = 40;
      for (let x = 0; x < width; x += step) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y < height; y += step) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }
    }

    // 2. Draw User Image Layer
    if (this.userImage) {
      ctx.save();
      // Move to center + pan offset
      const cx = width / 2 + (this.state.x * (width / this.canvas.width));
      const cy = height / 2 + (this.state.y * (height / this.canvas.height));
      ctx.translate(cx, cy);

      // Rotate
      ctx.rotate((this.state.rotation * Math.PI) / 180);

      // Flip
      ctx.scale(this.state.flipH, this.state.flipV);

      // Calculate scaled dimensions
      const totalScale = this.state.baseScale * this.state.scale * (width / this.canvas.width);
      const iw = this.userImage.width * totalScale;
      const ih = this.userImage.height * totalScale;

      // Filter
      ctx.filter = this.getFilterString();

      // Draw centered
      ctx.drawImage(this.userImage, -iw / 2, -ih / 2, iw, ih);
      ctx.restore();
    }

    // 3. Draw Frame Overlay
    if (this.frameImage) {
      ctx.save();
      ctx.filter = "none";
      ctx.drawImage(this.frameImage, 0, 0, width, height);
      ctx.restore();
    }
  }

  render() {
    this.renderToContext(this.ctx, this.canvas.width, this.canvas.height, false);
  }

  exportHighRes() {
    return new Promise((resolve) => {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = this.outputResolution;
      exportCanvas.height = this.outputResolution;
      const expCtx = exportCanvas.getContext('2d');

      // High image rendering smoothing
      expCtx.imageSmoothingEnabled = true;
      expCtx.imageSmoothingQuality = 'high';

      this.renderToContext(expCtx, this.outputResolution, this.outputResolution, true);

      exportCanvas.toBlob((blob) => {
        resolve(blob);
      }, 'image/png', 1.0);
    });
  }
}

// Confetti Particle System for Celebratory Downloads
function triggerConfetti() {
  const container = document.createElement('div');
  container.className = 'confetti-container';
  document.body.appendChild(container);

  const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];
  const particleCount = 70;

  for (let i = 0; i < particleCount; i++) {
    const particle = document.createElement('div');
    particle.className = 'confetti-particle';
    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    particle.style.left = `${Math.random() * 100}vw`;
    particle.style.top = '-20px';
    particle.style.transform = `rotate(${Math.random() * 360}deg)`;
    particle.style.animation = `confettiFall ${2 + Math.random() * 2}s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards`;

  }

  setTimeout(() => {

  }, 4500);

// Polyfill roundRect for maximum browser compatibility
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, radii) {
    let r = typeof radii === 'number' ? radii : (Array.isArray(radii) ? radii[0] : 0);
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

// Built-in Twibbon Frame Designer Studio
class FrameDesigner {
  constructor(canvasElement, options = {}) {
    this.canvas = canvasElement;
    this.ctx = canvasElement.getContext('2d');
    this.size = options.size || 1000;
    this.canvas.width = this.size;
    this.canvas.height = this.size;

    this.settings = {
      shape: 'circle', // circle, rounded, square, arch, octagon
      theme: 'royalBlue', // royalBlue, emerald, crimson, sunset, midnightGold, cyberNeon, rosePink
      borderWidth: 50,
      ringColor: '#fbbf24',
      headerText: 'CLASS OF 2026',
      headerColor: '#fbbf24',
      headerBg: '#0f172a',
      footerText: 'CONGRATULATIONS!',
      footerColor: '#ffffff',
      footerBg: '#0f172a',
      showCornerAccents: true,
      showSparkles: true
    };

    this.themes = {
      royalBlue: {
        gradient: ['#1e3a8a', '#2563eb', '#1d4ed8'],
        ring: '#fbbf24',
        accent: '#f59e0b'
      },
      emerald: {
        gradient: ['#064e3b', '#059669', '#10b981'],
        ring: '#a7f3d0',
        accent: '#34d399'
      },
      crimson: {
        gradient: ['#7f1d1d', '#b91c1c', '#dc2626'],
        ring: '#fef08a',
        accent: '#eab308'
      },
      sunset: {
        gradient: ['#c2410c', '#ea580c', '#f97316'],
        ring: '#fef08a',
        accent: '#fde047'
      },
      midnightGold: {
        gradient: ['#09090b', '#18181b', '#27272a'],
        ring: '#eab308',
        accent: '#fde047'
      },
      cyberNeon: {
        gradient: ['#1e1b4b', '#3730a3', '#4f46e5'],
        ring: '#06b6d4',
        accent: '#ec4899'
      },
      rosePink: {
        gradient: ['#881337', '#e11d48', '#fb7185'],
        ring: '#ffffff',
        accent: '#fbcfe8'
      }
    };

    this.render();
  }

  update(newSettings) {
    this.settings = { ...this.settings, ...newSettings };
    this.render();
  }

  render() {
    const ctx = this.ctx;
    const s = this.size;
    const center = s / 2;
    const radius = 370;

    // Clear canvas
    ctx.clearRect(0, 0, s, s);

    // Create offscreen canvas for cutout masking
    const maskCanvas = document.createElement('canvas');
    maskCanvas.width = s;
    maskCanvas.height = s;
    const mCtx = maskCanvas.getContext('2d');

    // 1. Draw solid outer frame background on maskCanvas
    const theme = this.themes[this.settings.theme] || this.themes.royalBlue;
    const grad = mCtx.createLinearGradient(0, 0, s, s);
    grad.addColorStop(0, theme.gradient[0]);
    grad.addColorStop(0.5, theme.gradient[1]);
    grad.addColorStop(1, theme.gradient[2]);
    mCtx.fillStyle = grad;
    mCtx.fillRect(0, 0, s, s);

    // 2. Cut out the transparent hole using 'destination-out'
    mCtx.globalCompositeOperation = 'destination-out';
    mCtx.fillStyle = '#000000';
    mCtx.beginPath();

    if (this.settings.shape === 'circle') {
      mCtx.arc(center, center, radius, 0, Math.PI * 2);
    } else if (this.settings.shape === 'rounded') {
      const rw = 720;
      const rh = 720;
      mCtx.roundRect(center - rw / 2, center - rh / 2, rw, rh, 70);
    } else if (this.settings.shape === 'square') {
      const sq = 720;
      mCtx.rect(center - sq / 2, center - sq / 2, sq, sq);
    } else if (this.settings.shape === 'arch') {
      const aw = 680;
      const ah = 720;
      const ax = center - aw / 2;
      const ay = center - ah / 2;
      mCtx.moveTo(ax, ay + ah);
      mCtx.lineTo(ax, ay + aw / 2);
      mCtx.arc(center, ay + aw / 2, aw / 2, Math.PI, 0);
      mCtx.lineTo(ax + aw, ay + ah);
      mCtx.closePath();
    } else if (this.settings.shape === 'octagon') {
      const r = 380;
      for (let i = 0; i < 8; i++) {
        const angle = (i * Math.PI) / 4 - Math.PI / 8;
        const x = center + r * Math.cos(angle);
        const y = center + r * Math.sin(angle);
        if (i === 0) mCtx.moveTo(x, y);
        else mCtx.lineTo(x, y);
      }
      mCtx.closePath();
    }
    mCtx.fill();

    // Reset composite operation
    mCtx.globalCompositeOperation = 'source-over';

    // 3. Draw masked frame to main canvas
    ctx.drawImage(maskCanvas, 0, 0);

    // 4. Draw Inner Ring / Border Accents
    ctx.save();
    ctx.strokeStyle = this.settings.ringColor || theme.ring;
    ctx.lineWidth = 14;
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 15;
    ctx.shadowOffsetY = 6;

    if (this.settings.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(center, center, radius + 2, 0, Math.PI * 2);
      ctx.stroke();

      // Dashed subtle secondary ring
      ctx.beginPath();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]);
      ctx.arc(center, center, radius + 18, 0, Math.PI * 2);
      ctx.stroke();
    } else if (this.settings.shape === 'rounded') {
      ctx.beginPath();
      ctx.roundRect(center - 362, center - 362, 724, 724, 72);
      ctx.stroke();
    } else if (this.settings.shape === 'square') {
      ctx.beginPath();
      ctx.rect(center - 362, center - 362, 724, 724);
      ctx.stroke();
    } else if (this.settings.shape === 'arch') {
      const aw = 684;
      const ah = 724;
      const ax = center - aw / 2;
      const ay = center - ah / 2;
      ctx.beginPath();
      ctx.moveTo(ax, ay + ah);
      ctx.lineTo(ax, ay + aw / 2);
      ctx.arc(center, ay + aw / 2, aw / 2, Math.PI, 0);
      ctx.lineTo(ax + aw, ay + ah);
      ctx.closePath();
      ctx.stroke();
    } else if (this.settings.shape === 'octagon') {
      const r = 384;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const angle = (i * Math.PI) / 4 - Math.PI / 8;
        const x = center + r * Math.cos(angle);
        const y = center + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();

    // 5. Corner Accents
    if (this.settings.showCornerAccents) {
      ctx.save();
      ctx.fillStyle = this.settings.ringColor || theme.ring;
      const offset = 60;
      const l = 100;
      // Top Left
      ctx.beginPath();
      ctx.moveTo(offset, offset + l);
      ctx.lineTo(offset + l, offset);
      ctx.lineTo(offset + l + 60, offset);
      ctx.lineTo(offset, offset + l + 60);
      ctx.closePath();
      ctx.fill();

      // Top Right
      ctx.beginPath();
      ctx.moveTo(s - offset, offset + l);
      ctx.lineTo(s - offset - l, offset);
      ctx.lineTo(s - offset - l - 60, offset);
      ctx.lineTo(s - offset, offset + l + 60);
      ctx.closePath();
      ctx.fill();

      // Bottom Left
      ctx.beginPath();
      ctx.moveTo(offset, s - offset - l);
      ctx.lineTo(offset + l, s - offset);
      ctx.lineTo(offset + l + 60, s - offset);
      ctx.lineTo(offset, s - offset - l - 60);
      ctx.closePath();
      ctx.fill();

      // Bottom Right
      ctx.beginPath();
      ctx.moveTo(s - offset, s - offset - l);
      ctx.lineTo(s - offset - l, s - offset);
      ctx.lineTo(s - offset - l - 60, s - offset);
      ctx.lineTo(s - offset, s - offset - l - 60);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 6. Header Badge Pill
    if (this.settings.headerText.trim()) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 6;

      const badgeWidth = Math.min(Math.max(ctx.measureText(this.settings.headerText).width + 120, 480), 760);
      const badgeHeight = 78;
      const bx = center - badgeWidth / 2;
      const by = 48;

      // Outer pill
      ctx.fillStyle = this.settings.headerBg || '#0f172a';
      ctx.beginPath();
      ctx.roundRect(bx, by, badgeWidth, badgeHeight, badgeHeight / 2);
      ctx.fill();

      // Border on pill
      ctx.strokeStyle = this.settings.headerColor || theme.ring;
      ctx.lineWidth = 3.5;
      ctx.stroke();

      // Text
      ctx.fillStyle = this.settings.headerColor || theme.ring;
      ctx.font = "900 32px 'Segoe UI', 'Kantumruy Pro', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.settings.headerText.toUpperCase(), center, by + badgeHeight / 2);
      ctx.restore();
    }

    // 7. Footer Badge / Ribbon
    if (this.settings.footerText.trim()) {
      ctx.save();
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 6;

      const footerWidth = Math.min(Math.max(ctx.measureText(this.settings.footerText).width + 120, 460), 780);
      const footerHeight = 78;
      const fx = center - footerWidth / 2;
      const fy = s - 128;

      ctx.fillStyle = this.settings.footerBg || '#0f172a';
      ctx.beginPath();
      ctx.roundRect(fx, fy, footerWidth, footerHeight, 20);
      ctx.fill();

      ctx.strokeStyle = this.settings.ringColor || theme.ring;
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = this.settings.footerColor || '#ffffff';
      ctx.font = "800 30px 'Segoe UI', 'Kantumruy Pro', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.settings.footerText.toUpperCase(), center, fy + footerHeight / 2);
      ctx.restore();
    }
  }

  getTransparentPNGDataUrl() {
    return this.canvas.toDataURL('image/png');
  }
}


// Main Single Page Application Coordinator & Router

class TwibbonApp {
  constructor() {
    this.currentView = 'explore';
    this.activeCampaign = null;
    this.activeStudio = null;
    this.activeDesigner = null;
    this.currentCategory = 'all';
    this.searchQuery = '';
    this.sortOrder = 'popular';

    // Force default to clean light mode
    const storedTheme = localStorage.getItem('twibbon_theme');
    this.theme = (storedTheme === 'dark' || storedTheme === 'light') ? storedTheme : 'light';
    // If it was previous dark, default to light for clean aesthetic
    if (!storedTheme) {
      this.theme = 'light';
      localStorage.setItem('twibbon_theme', 'light');
    }

    this.init();
  }

  init() {
    // 1. Apply theme
    document.documentElement.setAttribute('data-theme', this.theme);

    // 2. Initialize Firebase Auth
    if (typeof AuthService !== 'undefined') {
      AuthService.init();
      AuthService.onAuthStateChanged((user) => {
        this.updateNavAuth(user);
        if (this.currentView === 'create' || this.currentView === 'my-campaigns') {
          this.renderCurrentView();
        }
      });
    }

    // 3. Setup hash routing
    window.addEventListener('hashchange', () => this.handleRoute());

    // 4. Listen for language changes
    document.addEventListener('languageChanged', () => {
      this.updateStaticTranslations();
      this.updateNavAuth(AuthService ? AuthService.currentUser : null);
      this.renderCurrentView();
    });

    // 5. Initial route resolution
    this.updateStaticTranslations();
    this.handleRoute();
  }

  setTheme(theme) {
    this.theme = theme;
    localStorage.setItem('twibbon_theme', theme);
    document.documentElement.setAttribute('data-theme', theme);
    this.updateThemeIcons();
  }

  toggleTheme() {
    this.setTheme(this.theme === 'dark' ? 'light' : 'dark');
  }

  updateThemeIcons() {
    const themeBtn = document.getElementById('themeToggleBtn');
    if (themeBtn) {
      themeBtn.innerHTML = this.theme === 'dark' ? Icons.sun : Icons.moon;
    }
  }

  updateStaticTranslations() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (key) el.textContent = t(key);
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (key) el.placeholder = t(key);
    });

    const langBtnText = document.getElementById('langBtnText');
    if (langBtnText) {
      langBtnText.textContent = getLanguage() === 'km' ? 'ខ្មែរ' : 'EN';
    }

    this.updateThemeIcons();
  }

  updateNavAuth(user) {
    const container = document.getElementById('navAuthContainer');
    if (!container) return;

    if (!user) {
      container.innerHTML = `
        <button class="btn btn-outline btn-nav-signin" id="btnNavSignIn" onclick="app.openAuthModal()">

        overlay.remove();

        if (onSuccessCallback) onSuccessCallback();
      } catch (err) {
        console.error(err);
        if (err.code === 'auth/unauthorized-domain') {
          this.showToast(isKm ? "Domain មិនទាន់អនុញ្ញាតក្នុង Firebase Console ទេ សូម Add frame.tra4me.com ក្នុង Firebase Console > Authentication > Settings" : "Domain not authorized. Add frame.tra4me.com in Firebase Console > Authentication > Settings", 'error');
        } else if (err.code !== 'auth/popup-closed-by-user') {
          this.showToast(t('loginFailed'), 'error');
        }
      }
    });

    // Handle Email Login / Sign-up
    overlay.querySelector('#authEmailForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = overlay.querySelector('#authEmailInput').value.trim();
      const password = overlay.querySelector('#authPasswordInput').value;
      const name = overlay.querySelector('#authDisplayNameInput').value.trim();

      try {
        if (isSignUp) {
          const user = await AuthService.signUpWithEmail(email, password, name);
          overlay.remove();
          if (user && !user.emailVerified) {
            this.openOtpModal(email, () => {
              if (onSuccessCallback) onSuccessCallback();
            });
          } else {
            this.showToast(t('signupSuccess'), 'success');
            if (onSuccessCallback) onSuccessCallback();
          }
          return;
        } else {
          await AuthService.loginWithEmail(email, password);
          this.showToast(t('loginSuccess'), 'success');
          overlay.remove();
          if (onSuccessCallback) onSuccessCallback();
        }
      } catch (err) {
        console.error(err);
        let msg = t('loginFailed');
        if (err.code === 'auth/disposable-email') {
          msg = t('disposableEmailError');
        } else if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          msg = isKm ? "អ៊ីមែល ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវទេ" : "Incorrect email or password.";
        } else if (err.code === 'auth/email-already-in-use') {
          msg = isKm ? "អ៊ីមែលនេះមានគណនីរួចហើយ សូមជ្រើសរើស ចូលគណនី" : "Email already registered. Please sign in.";
        } else if (err.code === 'auth/weak-password') {
          msg = isKm ? "ពាក្យសម្ងាត់ត្រូវមានយ៉ាងតិច ៦ តួអក្សរ" : "Password must be at least 6 characters.";
        } else if (err.code === 'auth/operation-not-allowed') {
          msg = isKm ? "មុខងារ Email/Password មិនទាន់បានបើកក្នុង Firebase Console ទេ" : "Email/Password sign-in is disabled in Firebase Console.";
        } else if (err.code === 'auth/invalid-email') {
          msg = isKm ? "ទម្រង់អ៊ីមែលមិនត្រឹមត្រូវទេ" : "Invalid email address format.";
        } else if (err.code === 'auth/too-many-requests') {
          msg = err.message || (isKm ? "សូមរង់ចាំបន្តិចមុននឹងព្យាយាមម្តងទៀត" : "Too many requests. Please wait.");
        }
        this.showToast(msg, 'error');
      }
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.remove();
    });
  }

  // ==========================================
  // 6-DIGIT EMAIL OTP VERIFICATION MODAL

  openOtpModal(email, onSuccessCallback) {
    const existing = document.getElementById('traOtpModalOverlay');
    if (existing) existing.remove();

    const isKm = getLanguage() === 'km';
    const targetEmail = email || (AuthService.currentUser ? AuthService.currentUser.email : '');
    const cleanEmail = SecurityUtils.escapeHtml(targetEmail);

    const overlay = document.createElement('div');
    overlay.id = 'traOtpModalOverlay';
    overlay.className = 'modal-overlay';
    overlay.style.zIndex = '9999';

    overlay.innerHTML = `
      <div class="otp-modal-content">
        <button class="modal-close-btn" id="btnOtpClose" style="position: absolute; top: 1rem; right: 1rem;">${Icons.close}</button>
        
        <div class="otp-icon-wrapper">
          ${Icons.mail}
        </div>
        
        <h2 style="font-size: 1.45rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.4rem;">
          ${t('otpModalTitle')}
        </h2>
        
        <p style="color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; margin-bottom: 0.75rem;">
          ${t('otpModalSubtitle')}<br>
          <strong style="color: var(--accent-primary); word-break: break-all;">${cleanEmail}</strong>
        </p>

        <!-- 6-Digit Segmented Inputs -->
        <div class="otp-inputs-grid" id="otpInputsGrid">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-digit" data-index="0" autofocus>
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-digit" data-index="1">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-digit" data-index="2">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-digit" data-index="3">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-digit" data-index="4">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" class="otp-digit" data-index="5">
        </div>

        <div class="otp-timer-badge" id="otpTimerBadge">
          <span>⏱️ ${isKm ? 'សុពលភាព៖' : 'Expires in:'} <span id="otpCountdown">10:00</span></span>
        </div>

        <div class="otp-actions-wrapper">
          <button class="btn btn-primary" id="btnOtpSubmit" style="padding: 0.85rem; font-size: 1rem; width: 100%;" disabled>
            <span>${t('otpVerifyBtn')}</span>
          </button>
          
          <button class="btn btn-secondary" id="btnOtpResend" style="padding: 0.7rem; font-size: 0.88rem; width: 100%;">
            <span>${t('otpResendBtn')}</span>
          </button>
        </div>

        <div style="margin-top: 1.25rem; font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; background: var(--bg-secondary); padding: 0.65rem 0.85rem; border-radius: var(--radius-md); border: 1px dashed var(--border-color);">
          💡 ${isKm ? 'ប្រសិនបើមិនឃើញ Email ក្នុង Inbox សូមពិនិត្យមើលក្នុងប្រអប់ <strong>Spam</strong> ឬ <strong>Junk</strong>' : 'If you do not see the email, please check your <strong>Spam</strong> or <strong>Junk</strong> folder'}
        </div>
      </div>
    `;

    document.body.appendChild(overlay);

    const digits = overlay.querySelectorAll('.otp-digit');
    const submitBtn = overlay.querySelector('#btnOtpSubmit');
    const resendBtn = overlay.querySelector('#btnOtpResend');
    const countdownEl = overlay.querySelector('#otpCountdown');

    // Focus first input box
    setTimeout(() => {
      if (digits[0]) digits[0].focus();
    }, 100);

    const getEnteredOtp = () => Array.from(digits).map(d => d.value).join('');

    const checkFull = () => {
      const val = getEnteredOtp();
      const isComplete = val.length === 6 && /^\d{6}$/.test(val);
      submitBtn.disabled = !isComplete;
      if (isComplete) {
        doVerify();
      }
    };

    // Digit keyboard inputs
    digits.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/\D/g, '');
        e.target.value = val ? val[val.length - 1] : '';
        if (e.target.value) {
          e.target.classList.add('filled');
          if (idx < 5) digits[idx + 1].focus();
        } else {
          e.target.classList.remove('filled');
        }
        checkFull();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') {
          if (!input.value && idx > 0) {
            digits[idx - 1].focus();
            digits[idx - 1].value = '';
            digits[idx - 1].classList.remove('filled');
          } else {
            input.value = '';
            input.classList.remove('filled');
          }
          checkFull();
        } else if (e.key === 'ArrowLeft' && idx > 0) {
          digits[idx - 1].focus();
        } else if (e.key === 'ArrowRight' && idx < 5) {
          digits[idx + 1].focus();
        }
      });

      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
        const numOnly = pasteData.replace(/\D/g, '').slice(0, 6);
        if (numOnly) {
          for (let i = 0; i < 6; i++) {
            if (i < numOnly.length) {
              digits[i].value = numOnly[i];
              digits[i].classList.add('filled');
            } else {
              digits[i].value = '';
              digits[i].classList.remove('filled');
            }
          }
          const nextIdx = Math.min(5, numOnly.length);
          digits[nextIdx].focus();
          checkFull();
        }
      });
    });

    // 10-Minute Countdown
    let totalSeconds = 600;
    const timerInterval = setInterval(() => {
      totalSeconds--;
      if (totalSeconds <= 0) {
        clearInterval(timerInterval);
        countdownEl.textContent = "00:00";
        submitBtn.disabled = true;
        this.showToast(t('otpExpiredCode'), 'error');
        return;
      }
      const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const secs = String(totalSeconds % 60).padStart(2, '0');
      countdownEl.textContent = `${mins}:${secs}`;
    }, 1000);

    // Resend 60s cooldown
    let resendCooldown = 60;
    const startResendCooldown = () => {
      resendBtn.disabled = true;
      let left = resendCooldown;
      const resendInterval = setInterval(() => {
        left--;
        if (left <= 0) {
          clearInterval(resendInterval);
          resendBtn.disabled = false;
          resendBtn.textContent = t('otpResendBtn');
        } else {
          resendBtn.textContent = `${t('otpResendWait')} ${left}s`;
        }
      }, 1000);
    };
    startResendCooldown();

    // Verify logic
    let isVerifying = false;
    const doVerify = async () => {
      if (isVerifying) return;
      const code = getEnteredOtp();
      if (code.length !== 6) return;

      isVerifying = true;
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span>⏳ ${isKm ? 'កំពុងផ្ទៀងផ្ទាត់...' : 'Verifying...'}</span>`;

      try {
        const result = await OtpService.verifyOtp(targetEmail, code);
        if (result.success) {
          clearInterval(timerInterval);
          this.showToast(t('otpVerifiedSuccess'), 'success');
          overlay.remove();
          if (onSuccessCallback) onSuccessCallback();
        } else {
          isVerifying = false;
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>${t('otpVerifyBtn')}</span>`;
          if (result.reason === 'expired') {
            this.showToast(t('otpExpiredCode'), 'error');
          } else if (result.reason === 'max_attempts') {
            this.showToast(t('otpMaxAttempts'), 'error');
          } else {
            this.showToast(t('otpInvalidCode'), 'error');
            const grid = overlay.querySelector('#otpInputsGrid');
            if (grid) {
              grid.style.animation = 'shake 0.4s ease';
              setTimeout(() => { grid.style.animation = ''; }, 400);
            }
          }
        }
      } catch (err) {
        isVerifying = false;
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>${t('otpVerifyBtn')}</span>`;
        this.showToast(t('otpInvalidCode'), 'error');
      }
    };

    submitBtn.addEventListener('click', doVerify);

    // Resend logic
    resendBtn.addEventListener('click', async () => {
      resendBtn.disabled = true;
      try {
        await OtpService.generateOtp(targetEmail);
        this.showToast(t('verificationEmailSent'), 'success');
        startResendCooldown();
        digits.forEach(d => { d.value = ''; d.classList.remove('filled'); });
        digits[0].focus();
        submitBtn.disabled = true;
      } catch (err) {
        resendBtn.disabled = false;
        this.showToast(err.message || 'Error sending OTP', 'error');
      }
    });

    // Close button & backdrop
    const closeBtn = overlay.querySelector('#btnOtpClose');
    if (closeBtn) {
      closeBtn.addEventListener('click', () => {
        clearInterval(timerInterval);
        overlay.remove();
      });
    }

    // In-App OTP Notification listener (helps user see OTP instantly)
    const onOtpDispatched = (e) => {
      if (e.detail && e.detail.otpCode) {
        this.showToast(`📩 OTP Code: ${e.detail.otpCode}`, 'info', 8000);
      }
    };
    window.addEventListener('tra_otp_dispatched', onOtpDispatched, { once: true });
  }

  async copyToClipboard(text) {
    if (!text) return false;
    let successful = false;

    // Method 1: Modern navigator.clipboard API
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        successful = true;
      } catch (err) {
        console.warn('navigator.clipboard.writeText failed, attempting fallback...', err);
      }
    }

    // Method 2: Robust Fallback with temporary textarea
    if (!successful) {
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.top = '0';
        textArea.style.left = '-9999px';
        textArea.style.width = '2em';
        textArea.style.height = '2em';
        textArea.style.padding = '0';
        textArea.style.border = 'none';
        textArea.style.outline = 'none';
        textArea.style.boxShadow = 'none';
        textArea.style.background = 'transparent';
        textArea.setAttribute('readonly', '');
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        textArea.setSelectionRange(0, textArea.value.length);
        successful = document.execCommand('copy');
        document.body.removeChild(textArea);
      } catch (err) {
        console.error('execCommand copy fallback failed:', err);
      }
    }

    return successful;
  }

  handleRoute() {
    const hash = window.location.hash.slice(1) || 'explore';
    const parts = hash.split('/');
    const mainRoute = parts[0];
    const param = parts[1];

    this.updateNavLinks(mainRoute);

    if (mainRoute === 'campaign' && param) {
      this.loadCampaignView(param);
    } else if (mainRoute === 'create') {
      this.loadCreateView(param);
    } else if (mainRoute === 'designer') {
      this.loadDesignerView();
    } else if (mainRoute === 'my-campaigns') {
      this.loadMyCampaignsView();
    } else {
      this.loadExploreView();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  updateNavLinks(activeRoute) {
    document.querySelectorAll('.nav-link, .mobile-nav-item').forEach(link => {
      const route = link.getAttribute('data-route');
      if (route === activeRoute) {
        link.classList.add('active');
      } else {
        link.classList.remove('active');
      }
    });
  }

  renderCurrentView() {
    this.handleRoute();
  }

  setQuickSearch(tag) {
    this.searchQuery = tag;
    this.loadExploreView();
