  <style>
/* =========================================================
   TRA FRAMES — ULTRA-CLEAN MODERN DESIGN SYSTEM
   Inspired by Linear, Apple, Twibbonize & Stripe Design Systems
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300..700;1,300..700&family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&display=swap');

:root {
  --font-main: 'Kantumruy Pro', 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* Ultra-Clean Light Palette */
  --bg-main: #f8fafc;
  --bg-card: #ffffff;
  --bg-secondary: #f1f5f9;
  --bg-glass: rgba(255, 255, 255, 0.86);
  --border-color: #e2e8f0;
  --border-hover: #cbd5e1;
  --border-subtle: rgba(226, 232, 240, 0.7);

  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;

  /* Signature Emerald Green Accent */
  --accent-primary: #10b981;
  --accent-hover: #059669;
  --accent-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
  --accent-soft: rgba(16, 185, 129, 0.08);
  --accent-glow: rgba(16, 185, 129, 0.22);

  /* Modern Radius */
  --radius-xs: 6px;
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --radius-full: 9999px;

  /* Layered Soft Shadows */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);
  --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
  --shadow-md: 0 6px 16px -2px rgba(0, 0, 0, 0.06), 0 2px 6px -1px rgba(0, 0, 0, 0.03);
  --shadow-lg: 0 16px 32px -4px rgba(0, 0, 0, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
  --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.03), 0 10px 24px -3px rgba(0, 0, 0, 0.05);
  --shadow-glow: 0 0 22px rgba(16, 185, 129, 0.25);
}

[data-theme="dark"] {
  /* Rich Dark Slate Palette */
  --bg-main: #090d16;
  --bg-card: #111827;
  --bg-secondary: #1a2336;
  --bg-glass: rgba(17, 24, 39, 0.86);
  --border-color: #233047;
  --border-hover: #334464;
  --border-subtle: rgba(255, 255, 255, 0.06);

  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;

  --accent-soft: rgba(16, 185, 129, 0.15);
  --accent-glow: rgba(16, 185, 129, 0.35);

  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
  --shadow-sm: 0 2px 5px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 6px 18px -2px rgba(0, 0, 0, 0.45);
  --shadow-lg: 0 16px 36px -4px rgba(0, 0, 0, 0.6);
  --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.35), 0 12px 28px -4px rgba(0, 0, 0, 0.5);
  --shadow-glow: 0 0 28px rgba(16, 185, 129, 0.35);
}

/* ========================================= */
/* BASE & RESET                              */
/* ========================================= */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: var(--font-main);
  background-color: var(--bg-main);
  color: var(--text-primary);
  min-height: 100vh;
  line-height: 1.6;
  transition: background-color 0.25s ease, color 0.25s ease;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
  width: 100%;
  max-width: 100vw;
}

svg {
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}

/* ========================================= */
/* TOP NAVIGATION BAR                        */
/* ========================================= */
.navbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-color);
  box-shadow: var(--shadow-xs);
  width: 100%;
  max-width: 100vw;
  transition: all 0.2s ease;
}

.nav-container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0.75rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
}

.nav-brand {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  font-weight: 800;
  font-size: 1.28rem;
  cursor: pointer;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  white-space: nowrap;
  user-select: none;
  text-decoration: none;
}

.brand-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--accent-gradient);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
  flex-shrink: 0;
}

.brand-icon svg {
  width: 20px;
  height: 20px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.nav-link {
  padding: 0.48rem 0.95rem;
  border-radius: var(--radius-full);
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 0.9rem;
  transition: all 0.15s ease;
  cursor: pointer;
  white-space: nowrap;
  text-decoration: none;
}

.nav-link:hover {
  color: var(--text-primary);
  background: var(--bg-secondary);
}

.nav-link.active {
  background: var(--accent-soft);
  color: var(--accent-primary);
  font-weight: 700;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  white-space: nowrap;
}

/* Buttons System */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.62rem 1.25rem;
  border-radius: var(--radius-full);
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  border: 1px solid transparent;
  outline: none;
  white-space: nowrap !important;
  line-height: 1.4;
  text-decoration: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.btn:active {
  transform: scale(0.97);
}

.btn-primary {
  background: var(--accent-gradient);
  color: #ffffff !important;
  border-color: var(--accent-primary);
  box-shadow: 0 2px 8px rgba(16, 185, 129, 0.28);
}

.btn-primary:hover {
  filter: brightness(1.06);
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.38);
}

.btn-secondary {
  background: var(--bg-card);
  color: var(--text-primary);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-xs);
}

.btn-secondary:hover {
  border-color: var(--accent-primary);
  color: var(--accent-primary);
  background: var(--bg-secondary);
}

.btn-outline {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
}

.btn-outline:hover {
  background: var(--bg-secondary);
  color: var(--text-primary);
  border-color: var(--border-hover);
}

.btn-success {
  background: var(--accent-gradient);
  color: #ffffff !important;
  border: none;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.32);
}

.btn-success:hover {
  filter: brightness(1.08);
  box-shadow: 0 6px 18px rgba(16, 185, 129, 0.42);
  transform: translateY(-1px);
}

.btn-icon {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
  flex-shrink: 0;
  padding: 0;
  box-shadow: var(--shadow-xs);
}

.btn-icon:hover {
  color: var(--text-primary);
  border-color: var(--accent-primary);
  background: var(--bg-secondary);
  transform: translateY(-1px);
}

.btn-icon:active {
  transform: scale(0.94);
}

.btn-icon svg {
  width: 18px;
  height: 18px;
}

.btn-nav-signin {
  padding: 0.45rem 0.95rem;
  font-size: 0.85rem;
  gap: 0.4rem;
}

.btn-nav-create {
  padding: 0.5rem 1.15rem;
  font-size: 0.88rem;
  gap: 0.45rem;
}

/* User Profile Badge & Dropdown */
.user-profile-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.3rem 0.65rem 0.3rem 0.3rem;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-full);
  cursor: pointer;
  position: relative;
  transition: all 0.15s ease;
  user-select: none;
  max-width: 175px;
  box-shadow: var(--shadow-xs);
}

.user-profile-badge:hover {
  border-color: var(--accent-primary);
  background: var(--bg-secondary);
}

.user-avatar-img {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-full);
  object-fit: cover;
  flex-shrink: 0;
}

.user-avatar-placeholder {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-full);
  background: var(--accent-gradient);
  color: #ffffff;
  font-weight: 700;
  font-size: 0.8rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.user-name-text {
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--text-primary);
  max-width: 95px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.user-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 210px;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  padding: 0.4rem;
  z-index: 1050;
  animation: fadeIn 0.15s ease;
}

.user-dropdown-item {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.6rem 0.8rem;
  border-radius: var(--radius-xs);
  background: transparent;
  border: none;
  color: var(--text-primary);
  font-size: 0.86rem;
  font-weight: 500;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: all 0.12s ease;
}

.user-dropdown-item:hover {
  background: var(--bg-secondary);
  color: var(--accent-primary);
}

.user-dropdown-item.danger {
  color: #ef4444;
}

.user-dropdown-item.danger:hover {
  background: rgba(239, 68, 68, 0.08);
  color: #dc2626;
}

/* ========================================= */
/* MAIN CONTENT & HERO                       */
/* ========================================= */
.main-wrapper {
  max-width: 1240px;
  margin: 0 auto;
  padding: 2rem 1.5rem 5rem 1.5rem;
  width: 100%;
}

/* Minimalist Explore Hero */
.explore-hero-minimal {
  text-align: center;
  padding: 1.25rem 0.5rem 0.5rem 0.5rem;
  max-width: 620px;
  margin: 0 auto 0.5rem auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.85rem;
  position: relative;
}

.explore-hero-title {
  font-size: clamp(1.4rem, 3vw, 1.85rem);
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  margin: 0;
}

.explore-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 1.25rem 0 1rem 0;
  padding: 0 0.25rem;
}

.explore-section-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  margin: 0;
}

.explore-section-count {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-muted);
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  padding: 0.2rem 0.6rem;
  border-radius: var(--radius-full);
}

/* Modern Centered Hero with Ambient Glow */
.hero-clean {
  text-align: center;
  padding: 2.75rem 1.25rem 2.5rem 1.25rem;
  max-width: 820px;
  margin: 0 auto 1.5rem auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.15rem;
  position: relative;
}

.hero-clean::before {
  content: "";
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 600px;
  height: 240px;
  background: radial-gradient(ellipse at center, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
  pointer-events: none;
  z-index: -1;
}

.hero-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.35rem 1rem;
  border-radius: var(--radius-full);
  background: var(--accent-soft);
  border: 1px solid rgba(16, 185, 129, 0.25);
  color: var(--accent-primary);
  font-size: 0.84rem;
  font-weight: 700;
  letter-spacing: 0.01em;
}

.hero-pill svg {
  width: 16px;
  height: 16px;
  color: var(--accent-primary);
}

.hero-title {
  font-size: clamp(1.85rem, 3.4vw, 2.75rem);
  font-weight: 800;
  line-height: 1.35;
  color: var(--text-primary);
  word-break: keep-all;
  letter-spacing: -0.02em;
}

.hero-subtitle {
  font-size: 1.05rem;
  color: var(--text-secondary);
  line-height: 1.7;
  max-width: 620px;
  margin: 0 auto;
}

.hero-search-box {
  position: relative;
  width: 100%;
  max-width: 580px;
  margin-top: 0.35rem;
}

.hero-search-input {
  width: 100%;
  padding: 0.95rem 1.35rem 0.95rem 3.35rem;
  border-radius: var(--radius-full);
  background: var(--bg-card);
  border: 1.5px solid var(--border-color);
  color: var(--text-primary);
  font-size: 1rem;
  outline: none;
  transition: all 0.2s ease;
  box-shadow: var(--shadow-sm);
  font-family: inherit;
}

.hero-search-input:focus {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 4px var(--accent-soft);
}

.hero-search-icon {
  position: absolute;
  left: 1.25rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
  display: flex;
  align-items: center;
}

.hero-search-icon svg {
  width: 18px;
  height: 18px;
}

.hero-search-tags {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  justify-content: center;
  font-size: 0.84rem;
  color: var(--text-muted);
  margin-top: 0.2rem;
}

.hero-search-tags a {
  color: var(--accent-primary);
  cursor: pointer;
  font-weight: 600;
  transition: opacity 0.15s ease;
}

.hero-search-tags a:hover {
  text-decoration: underline;
  opacity: 0.85;
}

.hero-actions {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 0.5rem;
}

/* ========================================= */
/* CATEGORIES BAR                            */
/* ========================================= */
.categories-bar {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  overflow-x: auto;
  padding: 0.4rem 0 1rem 0;
  scrollbar-width: none;
  margin-bottom: 1.5rem;
  -webkit-overflow-scrolling: touch;
}

.categories-bar::-webkit-scrollbar {
  display: none;
}

.category-chip {
  padding: 0.55rem 1.15rem;
  border-radius: var(--radius-full);
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-xs);
  user-select: none;
}

.category-chip:hover {
  color: var(--text-primary);
  border-color: var(--accent-primary);
  background: var(--bg-secondary);
}

.category-chip.active {
  background: var(--accent-primary);
  color: #ffffff !important;
  border-color: var(--accent-primary);
  box-shadow: 0 2px 8px rgba(16, 185, 129, 0.35);
}

/* ========================================= */
/* CAMPAIGN CARDS GRID                       */
/* ========================================= */
.campaign-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
  gap: 1.65rem;
}

.campaign-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease, border-color 0.22s ease;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-card);
  cursor: pointer;
  position: relative;
}

.campaign-card:hover {
  transform: translateY(-5px);
  border-color: var(--accent-primary);
  box-shadow: var(--shadow-lg);
}

/* Realistic Card Preview (Avatar Backdrop + Frame Overlay) */
.card-preview-wrapper {
  position: relative;
  aspect-ratio: 1 / 1;
  background: var(--bg-secondary);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border-color);
}

.card-sample-backdrop {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.92;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 1;
}

.card-preview-frame {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 2;
}

.campaign-card:hover .card-preview-frame,
.campaign-card:hover .card-sample-backdrop {
  transform: scale(1.035);
}

.card-badge-category {
  position: absolute;
  top: 0.85rem;
  left: 0.85rem;
  padding: 0.32rem 0.8rem;
  border-radius: var(--radius-full);
  background: rgba(15, 23, 42, 0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #ffffff;
  font-size: 0.75rem;
  font-weight: 700;
  z-index: 3;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
}

.card-badge-supporters {
  position: absolute;
  bottom: 0.85rem;
  right: 0.85rem;
  padding: 0.32rem 0.8rem;
  border-radius: var(--radius-full);
  background: rgba(15, 23, 42, 0.72);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #ffffff;
  font-size: 0.78rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  z-index: 3;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
}

.card-badge-supporters svg {
  width: 13px;
  height: 13px;
}

.card-content {
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
  gap: 0.65rem;
}

.card-title {
  font-size: 1.08rem;
  font-weight: 700;
  line-height: 1.45;
  color: var(--text-primary);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  cursor: pointer;
  transition: color 0.15s ease;
}

.card-title:hover {
  color: var(--accent-primary);
}

.card-creator {
  font-size: 0.85rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.card-creator svg {
  width: 14px;
  height: 14px;
}

.card-description {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 0.35rem;
}

.card-footer {
  margin-top: auto;
  display: flex;
  gap: 0.5rem;
  width: 100%;
}

.btn-use-frame {
  flex: 1;
}

.btn-card-share {
  padding: 0.6rem 0.85rem;
  flex-shrink: 0;
}

.btn-card-share svg {
  width: 16px;
  height: 16px;
}

/* ========================================= */
/* STUDIO / INTERACTIVE CANVAS WORKSPACE     */
/* ========================================= */
.studio-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.studio-header-title-wrap {
  flex: 1;
  min-width: 260px;
}

.studio-header-title {
  font-size: 1.65rem;
  font-weight: 800;
  line-height: 1.35;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.studio-header-meta {
  display: flex;
  align-items: center;
  gap: 1.15rem;
  color: var(--text-secondary);
  font-size: 0.88rem;
  flex-wrap: wrap;
  margin-top: 0.25rem;
}

.studio-header-meta span {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}

.studio-header-meta svg {
  width: 14px;
  height: 14px;
}

.studio-layout {
  display: grid;
  grid-template-columns: 460px 1fr;
  gap: 2.25rem;
  align-items: start;
}

/* Left Column: Interactive Canvas Card */
.canvas-wrapper-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1.15rem;
  box-shadow: var(--shadow-card);
  position: sticky;
  top: 80px;
}

.canvas-container {
  width: 100%;
  max-width: 420px;
  aspect-ratio: 1 / 1;
  position: relative;
  border-radius: var(--radius-md);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-color);
  background-image: 
    linear-gradient(45deg, #e2e8f0 25%, transparent 25%), 
    linear-gradient(-45deg, #e2e8f0 25%, transparent 25%), 
    linear-gradient(45deg, transparent 75%, #e2e8f0 75%), 
    linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
  touch-action: none;
}

[data-theme="dark"] .canvas-container {
  background-image: 
    linear-gradient(45deg, #1e293b 25%, transparent 25%), 
    linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
    linear-gradient(45deg, transparent 75%, #1e293b 75%), 
    linear-gradient(-45deg, transparent 75%, #1e293b 75%);
}

#studioCanvas, #designerCanvas {
  width: 100% !important;
  height: 100% !important;
  display: block !important;
  object-fit: contain !important;
  cursor: grab;
}

#studioCanvas:active {
  cursor: grabbing;
}

.studio-hint-text {
  font-size: 0.82rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-weight: 500;
}

.studio-toolbar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.65rem;
}

/* Upload Photo Section (Directly under Canvas) */
.studio-upload-section {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.photo-dropzone {
  border: 2px dashed #cbd5e1;
  border-radius: var(--radius-md);
  padding: 1.15rem 1rem;
  text-align: center;
  background: var(--bg-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.85rem;
  user-select: none;
}

[data-theme="dark"] .photo-dropzone {
  border-color: #334464;
}

.photo-dropzone:hover {
  border-color: var(--accent-primary);
  background: var(--accent-soft);
  transform: translateY(-1px);
}

.dropzone-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--bg-card);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent-primary);
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}

.dropzone-icon svg {
  width: 20px;
  height: 20px;
}

.dropzone-text {
  display: flex;
  flex-direction: column;
  text-align: left;
  gap: 0.1rem;
}

.dropzone-main-text {
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--text-primary);
}

.dropzone-sub-text {
  font-size: 0.78rem;
  color: var(--text-muted);
}

/* Sample Avatars Row */
.sample-avatars-row {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  flex-wrap: wrap;
}

.sample-avatars-label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.sample-avatar-pills {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.sample-avatar-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 2px solid var(--border-color);
  overflow: hidden;
  cursor: pointer;
  padding: 0;
  background: transparent;
  transition: all 0.18s ease;
  box-shadow: var(--shadow-xs);
  flex-shrink: 0;
}

.sample-avatar-btn:hover {
  transform: scale(1.12);
  border-color: var(--accent-primary);
}

.sample-avatar-btn img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Slider Controls */
.slider-group {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  width: 100%;
}

.zoom-slider-group {
  background: var(--bg-secondary);
  padding: 0.85rem 1rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
}

.slider-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.86rem;
  color: var(--text-secondary);
  font-weight: 600;
}

.slider-val-badge {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--accent-primary);
  background: var(--accent-soft);
  padding: 0.15rem 0.55rem;
  border-radius: var(--radius-full);
}

.range-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 7px;
  border-radius: var(--radius-full);
  background: #e2e8f0;
  outline: none;
  touch-action: pan-y;
  cursor: pointer;
}

[data-theme="dark"] .range-slider {
  background: #273548;
}

.range-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent-primary);
  box-shadow: 0 2px 8px rgba(16, 185, 129, 0.45);
  cursor: pointer;
  transition: transform 0.15s ease, background 0.15s ease;
}

.range-slider::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  background: var(--accent-primary);
  box-shadow: 0 2px 8px rgba(16, 185, 129, 0.45);
  cursor: pointer;
}

.range-slider::-webkit-slider-thumb:hover,
.range-slider::-webkit-slider-thumb:active {
  transform: scale(1.2);
}

.btn-download-main {
  width: 100%;
  padding: 0.95rem 1.5rem;
  font-size: 1.05rem;
  font-weight: 700;
  border-radius: var(--radius-full);
}

.btn-download-main svg {
  width: 20px;
  height: 20px;
}

/* Right Column: Studio Controls Card */
.studio-controls-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  padding: 1.85rem;
  display: flex;
  flex-direction: column;
  gap: 1.65rem;
  box-shadow: var(--shadow-card);
}

.tool-section-title {
  font-size: 0.95rem;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 0.65rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  letter-spacing: -0.01em;
}

.tool-section-title svg {
  width: 18px;
  height: 18px;
  color: var(--accent-primary);
}

.campaign-about-section {
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 1.25rem;
}

.campaign-about-desc {
  font-size: 0.92rem;
  color: var(--text-secondary);
  line-height: 1.65;
}

.sliders-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.85rem;
  background: var(--bg-secondary);
  padding: 1.15rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
}

/* Share Box & QR Code */
.campaign-share-box {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 1.15rem;
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

.share-box-header {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-primary);
}

.share-link-input-group {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}

.share-link-input {
  flex: 1;
  padding: 0.72rem 1rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 0.9rem;
  font-family: monospace;
  outline: none;
}

.share-link-input:focus {
  border-color: var(--accent-primary);
}

.share-qr-container {
  display: flex;
  align-items: center;
  gap: 1.15rem;
  background: var(--bg-card);
  padding: 0.85rem 1rem;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
}

.share-qr-img {
  width: 84px;
  height: 84px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  background: #ffffff;
  flex-shrink: 0;
}

.share-qr-desc {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.share-qr-desc strong {
  font-size: 0.9rem;
  color: var(--text-primary);
}

.share-qr-desc span {
  font-size: 0.8rem;
  color: var(--text-muted);
  line-height: 1.45;
}

.cloud-sync-status {
  font-size: 0.82rem;
  color: #10b981;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.caption-box {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 1rem;
  font-size: 0.9rem;
  color: var(--text-secondary);
  line-height: 1.6;
}

.caption-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 0.65rem;
}

.social-share-row {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  flex-wrap: wrap;
}

.btn-social {
  flex: 1;
  min-width: 100px;
}

.btn-download-bottom {
  display: none;
  width: 100%;
  padding: 0.95rem 1.5rem;
  font-size: 1.05rem;
  font-weight: 700;
}

/* ========================================= */
/* MODAL & DIALOG                            */
/* ========================================= */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  animation: fadeIn 0.2s ease;
}

.modal-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  max-width: 480px;
  width: 100%;
  padding: 1.85rem;
  box-shadow: var(--shadow-lg);
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  animation: slideInUp 0.22s ease;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 0.75rem;
}

.modal-header h3 {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.modal-close-btn {
  background: transparent;
  border: none;
  font-size: 1.5rem;
  color: var(--text-muted);
  cursor: pointer;
  line-height: 1;
}

.modal-close-btn:hover {
  color: var(--text-primary);
}

/* Form Styles */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}

.form-label {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text-primary);
}

.form-input, .form-textarea, .form-select {
  padding: 0.8rem 1.1rem;
  border-radius: var(--radius-md);
  background: var(--bg-card);
  border: 1.5px solid var(--border-color);
  color: var(--text-primary);
  font-size: 16px; /* 16px to prevent iOS Safari auto-zoom */
  outline: none;
  transition: all 0.15s ease;
  width: 100%;
  font-family: inherit;
}

.form-input:focus, .form-textarea:focus, .form-select:focus {
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.form-row-2col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

/* Toast System */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.8rem 1.35rem;
  border-radius: var(--radius-full);
  background: #0f172a;
  color: #ffffff;
  font-weight: 600;
  font-size: 0.9rem;
  box-shadow: var(--shadow-lg);
  animation: slideInRight 0.25s ease forwards;
}

.toast-success {
  border-left: 4px solid #10b981;
}

/* Confetti */
.confetti-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 99999;
  overflow: hidden;
}

.confetti-particle {
  position: absolute;
  width: 8px;
  height: 12px;
  border-radius: 2px;
}

/* Auth & Social Styles */
.btn-google {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  width: 100%;
  padding: 0.8rem 1.25rem;
  border-radius: var(--radius-md);
  background: #ffffff;
  border: 1.5px solid #dadce0;
  color: #3c4043;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 1px 3px rgba(60, 64, 67, 0.08);
}

[data-theme="dark"] .btn-google {
  background: #1e293b;
  border-color: #334155;
  color: #f1f5f9;
}

.btn-google:hover {
  background: #f8fafd;
  border-color: #c2c7d0;
  box-shadow: 0 2px 6px rgba(60, 64, 67, 0.15);
  transform: translateY(-1px);
}

[data-theme="dark"] .btn-google:hover {
  background: #273548;
  border-color: #475569;
}

.auth-divider {
  display: flex;
  align-items: center;
  gap: 1rem;
  color: var(--text-muted);
  font-size: 0.85rem;
  font-weight: 600;
  margin: 0.65rem 0;
}

.auth-divider::before,
.auth-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border-color);
}

.auth-tabs {
  display: flex;
  border-bottom: 1.5px solid var(--border-color);
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.auth-tab {
  padding: 0.5rem 1rem 0.75rem 1rem;
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text-secondary);
  cursor: pointer;
  border-bottom: 2.5px solid transparent;
  margin-bottom: -2px;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  transition: all 0.15s ease;
}

.auth-tab.active {
  color: var(--accent-primary);
  border-bottom-color: var(--accent-primary);
}

.auth-gate-card {
  max-width: 500px;
  margin: 2.5rem auto;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xl);
  padding: 2.5rem 2rem;
  text-align: center;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.auth-gate-icon {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
}

.auth-gate-icon svg {
  width: 30px;
  height: 30px;
}

/* Mobile Bottom Bar (iOS/Material 3 style) */
.mobile-bottom-bar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 999;
  background: var(--bg-glass);
  border-top: 1px solid var(--border-color);
  padding: 0.5rem 0.75rem calc(0.5rem + env(safe-area-inset-bottom, 0px)) 0.75rem;
  justify-content: space-around;
  align-items: center;
  box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.06);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.mobile-nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.25rem;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 0.35rem 0.65rem;
  border-radius: var(--radius-sm);
  transition: all 0.15s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.mobile-nav-item svg {
  width: 20px;
  height: 20px;
  transition: transform 0.15s ease;
}

.mobile-nav-item:active svg {
  transform: scale(0.9);
}

.mobile-nav-item.active {
  color: var(--accent-primary);
  font-weight: 700;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideInUp {
  from { transform: translateY(16px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes slideInRight {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
}

/* ========================================= */
/* RESPONSIVE DESIGN (TABLET & MOBILE)       */
/* ========================================= */

@media (max-width: 960px) {
  .studio-layout {
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }

  .canvas-wrapper-card {
    position: static !important;
    top: auto !important;
    padding: 1.25rem;
    gap: 1rem;
  }

  .btn-download-bottom {
    display: flex;
  }
}

@media (max-width: 768px) {
  .navbar {
    width: 100%;
    max-width: 100vw;
  }

  .nav-container { 
    padding: 0.5rem 0.85rem; 
    gap: 0.5rem;
  }

  .nav-links { 
    display: none !important; 
  }

  .btn-nav-create,
  .nav-actions > .btn-primary:not(#navAuthContainer *) { 
    display: none !important; 
  }

  .nav-actions {
    gap: 0.4rem;
  }

  .nav-brand {
    font-size: 1.15rem;
    gap: 0.5rem;
  }

  .brand-icon {
    width: 32px;
    height: 32px;
  }

  .brand-icon svg {
    width: 18px;
    height: 18px;
  }

  .nav-actions .btn-icon {
    width: 34px !important;
    height: 34px !important;
  }

  .btn-nav-signin, #btnNavSignIn {
    padding: 0.35rem 0.75rem !important;
    font-size: 0.82rem !important;
    gap: 0.3rem !important;
  }

  .btn-nav-signin svg, #btnNavSignIn svg {
    width: 14px !important;
    height: 14px !important;
  }

  .user-profile-badge {
    padding: 0.25rem 0.5rem 0.25rem 0.25rem;
    font-size: 0.8rem;
    max-width: 135px;
  }

  .user-name-text {
    max-width: 65px;
  }

  .mobile-bottom-bar {
    display: flex !important;
  }

  .main-wrapper { 
    padding: 1.25rem 0.85rem calc(5.5rem + env(safe-area-inset-bottom, 0px)) 0.85rem; 
  }

  .campaign-grid { 
    grid-template-columns: 1fr; 
    gap: 1.25rem;
  }

  .explore-hero-minimal {
    padding: 0.75rem 0.25rem 0.35rem 0.25rem;
    gap: 0.65rem;
    margin-bottom: 0.35rem;
  }

  .explore-hero-title {
    font-size: 1.35rem;
  }

  .categories-bar {
    margin-bottom: 0.85rem;
    padding: 0.2rem 0 0.5rem 0;
  }

  .explore-section-header {
    margin: 0.65rem 0 0.75rem 0;
  }

  .hero-clean {
    padding: 1.5rem 0.5rem 1.75rem 0.5rem;
    gap: 0.85rem;
  }

  .hero-title {
    font-size: 1.75rem;
    line-height: 1.35;
  }

  .hero-subtitle {
    font-size: 0.95rem;
  }

  .studio-header-title {
    font-size: 1.35rem;
  }

  .studio-controls-card {
    padding: 1.25rem;
    gap: 1.25rem;
  }

  .share-link-input-group {
    flex-direction: column;

let currentLang = localStorage.getItem('twibbon_lang') || 'km';

function t(key) {
  if (translations[currentLang] && translations[currentLang][key]) {
    return translations[currentLang][key];
  }
  if (translations.en && translations.en[key]) {
    return translations.en[key];
  }
  return key;
}

function setLanguage(lang) {
  if (translations[lang]) {
    currentLang = lang;
    localStorage.setItem('twibbon_lang', lang);
    document.documentElement.lang = lang;
    document.dispatchEvent(new CustomEvent('languageChanged', { detail: { lang } }));
  }
}

function getLanguage() {
  return currentLang;
}

// Security Utilities (Anti-XSS, URL Sanitization & Input Validation)
const SecurityUtils = {
  escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;')
      .replace(/\//g, '&#x2F;');
  },
  
  sanitizeUrl(url) {
    if (!url || typeof url !== 'string') return '#';
    const trimmed = url.trim();
    if (/^(https?:\/\/|\/|#|data:image\/(png|jpeg|jpg|webp|svg\+xml)[;,])/i.test(trimmed)) {
      return trimmed;
    }
    return '#';
  },

  validateImageFile(file) {
    if (!file) return { valid: false, error: 'No file selected.' };
    const maxSizeBytes = 5 * 1024 * 1024; // 5 MB
    if (file.size > maxSizeBytes) {
      return { valid: false, error: 'File size exceeds 5MB limit. Please upload a smaller image.' };
    }
    const allowedTypes = ['image/png', 'image/jpeg', 'image/jpg', 'image/webp'];
    if (!allowedTypes.includes(file.type.toLowerCase())) {
      return { valid: false, error: 'Invalid file type. Only PNG, JPG, and WebP images are allowed.' };
    }
    return { valid: true };
  }
};

const escapeHtml = (str) => SecurityUtils.escapeHtml(str);
const sanitizeUrl = (url) => SecurityUtils.sanitizeUrl(url);

const AuthService = {
  currentUser: null,
  listeners: [],
  initialized: false,

  init() {
    if (this.initialized) return;
    this.initialized = true;

    // 1. Check local session storage first
    try {
      const activeStored = localStorage.getItem("tra_active_user");
      if (activeStored) {
        this.currentUser = JSON.parse(activeStored);
        this.notifyListeners();
      }
    } catch (e) {}

    // 2. Connect to Firebase Auth
    const auth = initFirebaseAuth();
    if (!auth) return;

    auth.onAuthStateChanged((user) => {
      if (user) {
        this.currentUser = {
          uid: user.uid,
          email: user.email || '',
          displayName: user.displayName || (user.email ? user.email.split('@')[0] : 'Creator'),
          photoURL: user.photoURL || '',
          isLocal: false
        };
        try {
          localStorage.setItem("tra_active_user", JSON.stringify(this.currentUser));
        } catch (e) {}
      } else {
        if (this.currentUser && !this.currentUser.isLocal) {
          this.currentUser = null;
          try {
            localStorage.removeItem("tra_active_user");
          } catch (e) {}
        }
      }

      console.log("👤 Tra Frames Auth:", this.currentUser ? `Signed in as ${this.currentUser.displayName}` : "Guest");
      this.notifyListeners();
    });
  },

  onAuthStateChanged(callback) {
    this.listeners.push(callback);
    callback(this.currentUser);
  },

  notifyListeners() {
    this.listeners.forEach(cb => {
      try { cb(this.currentUser); } catch (e) { console.error(e); }
    });
  },

  isAuthenticated() {
    return !!this.currentUser;
  },

  async loginWithGoogle() {
    const auth = initFirebaseAuth();
    if (!auth) throw new Error("Firebase Auth is not available.");
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.addScope('profile');
    provider.addScope('email');
    provider.setCustomParameters({ prompt: 'select_account' });
    try {
      const result = await auth.signInWithPopup(provider);
      return result.user;
    } catch (err) {
      console.error("Google Sign-In Error:", err);
      throw err;
    }
  },

  async loginWithEmail(email, password) {
    const auth = initFirebaseAuth();
    if (auth) {
      try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        this.currentUser = {
          uid: result.user.uid,
          email: result.user.email,
          displayName: result.user.displayName || (result.user.email ? result.user.email.split('@')[0] : 'Creator'),
          photoURL: result.user.photoURL || '',
          isLocal: false
        };
        try { localStorage.setItem("tra_active_user", JSON.stringify(this.currentUser)); } catch (e) {}
        this.notifyListeners();
        return this.currentUser;
      } catch (err) {
        console.warn("Firebase Cloud Login Notice:", err);
        // If Firebase Console has provider disabled or account is local, check local accounts
        if (err.code === 'auth/operation-not-allowed' || err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          const local = this.loginLocal(email, password);
          if (local) return local;
        }
        throw err;
      }
    }
    return this.loginLocal(email, password);
  },

  async signUpWithEmail(email, password, displayName) {
    const auth = initFirebaseAuth();
    if (auth) {
      try {
        const result = await auth.createUserWithEmailAndPassword(email, password);
        if (displayName && result.user) {
          try { await result.user.updateProfile({ displayName }); } catch (e) {}
        }
        this.currentUser = {
          uid: result.user.uid,
          email: result.user.email,
          displayName: displayName || result.user.displayName || (result.user.email ? result.user.email.split('@')[0] : 'Creator'),
          photoURL: result.user.photoURL || '',
          isLocal: false
        };
        try { localStorage.setItem("tra_active_user", JSON.stringify(this.currentUser)); } catch (e) {}
        this.notifyListeners();
        return this.currentUser;
      } catch (err) {
        console.warn("Firebase Cloud Sign-Up Notice:", err);
        // If Firebase Console has Email/Password disabled (OPERATION_NOT_ALLOWED), fallback to seamless Local Account!
        if (err.code === 'auth/operation-not-allowed' || err.code === 'auth/network-request-failed') {
          return this.signUpLocal(email, password, displayName);
        }
        throw err;
      }
    }
    return this.signUpLocal(email, password, displayName);
  },

  signUpLocal(email, password, displayName) {
    const accounts = this.getLocalAccounts();
    const existing = accounts.find(a => a.email && a.email.toLowerCase() === email.toLowerCase());
    if (existing) {
      const err = new Error("Email already registered");
      err.code = 'auth/email-already-in-use';
      throw err;
    }
    const user = {
      uid: "local-" + Date.now(),
      email: email,
      displayName: displayName || email.split('@')[0] || 'Creator',
      photoURL: '',
      isLocal: true
    };
    accounts.push({ ...user, passwordHash: btoa(encodeURIComponent(password)) });
    try {
      localStorage.setItem("tra_local_accounts", JSON.stringify(accounts));
    } catch (e) {}
    this.currentUser = user;
    try {
      localStorage.setItem("tra_active_user", JSON.stringify(user));
    } catch (e) {}
    this.notifyListeners();
    return user;
  },

  loginLocal(email, password) {
    const accounts = this.getLocalAccounts();
    const hash = btoa(encodeURIComponent(password));
    const found = accounts.find(a => a.email && a.email.toLowerCase() === email.toLowerCase() && a.passwordHash === hash);
    if (!found) {
      const err = new Error("Invalid email or password");
      err.code = 'auth/invalid-credential';
      throw err;
    }
    const user = {
      uid: found.uid,
      email: found.email,
      displayName: found.displayName,
      photoURL: found.photoURL || '',
      isLocal: true
    };
    this.currentUser = user;
    try {
      localStorage.setItem("tra_active_user", JSON.stringify(user));
    } catch (e) {}
    this.notifyListeners();
    return user;
  },

  getLocalAccounts() {
    try {
      const stored = localStorage.getItem("tra_local_accounts");
      return stored ? JSON.parse(stored) : [];
    } catch (e) {
      return [];
    }
  },

  async logout() {
    this.currentUser = null;
    try {
      localStorage.removeItem("tra_active_user");
    } catch (e) {}
    const auth = initFirebaseAuth();
    if (auth) {
      try {
        await auth.signOut();
      } catch (e) {}
    }
    this.notifyListeners();
  }
};

const CampaignService = {
  _memoryCache: new Map(),

  getCampaigns() {

        userCampaigns = JSON.parse(stored);

    if (this._memoryCache) {
      for (const [id, c] of this._memoryCache.entries()) {

          combined.unshift(c);
        }
      }
    }
    return [...combined, ...INITIAL_CAMPAIGNS];

  getCampaignBySlugOrId(identifier) {
    if (!identifier) return null;
    if (this._memoryCache && this._memoryCache.has(identifier)) {
      return this._memoryCache.get(identifier);
    }
    const all = this.getCampaigns();
    return all.find(c => c.slug === identifier || c.id === identifier);
  },

  async compressFrameDataUrl(dataUrl, maxDim = 1080) {
    if (!dataUrl || typeof dataUrl !== 'string') return dataUrl;
    if (!dataUrl.startsWith('data:image')) return dataUrl;
    if (dataUrl.startsWith('data:image/svg+xml')) return dataUrl;

    return new Promise((resolve) => {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        try {
          let width = img.naturalWidth || img.width;
          let height = img.naturalHeight || img.height;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);

          // Try WebP first (supports alpha transparency and is 3-5x smaller than PNG)
          try {
            const webpUrl = canvas.toDataURL('image/webp', 0.85);
            if (webpUrl && webpUrl.startsWith('data:image/webp') && webpUrl.length < 800000) {
              return resolve(webpUrl);
            }
          } catch (e) {}

          // Fallback to PNG (guaranteed lossless transparency)
          const pngUrl = canvas.toDataURL('image/png');
          if (pngUrl.length < 900000) {
            return resolve(pngUrl);
          }

          // If still larger than 900KB, scale down slightly to 900x900 PNG
          canvas.width = Math.min(width, 900);
          canvas.height = Math.min(height, 900);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          return resolve(canvas.toDataURL('image/png'));
        } catch (err) {
          console.warn('Image compression exception, using original:', err);
          resolve(dataUrl);
        }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    });
  },

  async saveCampaign(campaignData) {
    let userCampaigns = [];
    try {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (stored) userCampaigns = JSON.parse(stored);
    } catch (e) {
      userCampaigns = [];
    }

    const safeSlug = (campaignData.slug || campaignData.titleEn || "campaign")
      .toLowerCase()
      .replace(/[^a-z0-9-]+/g, "")
      .replace(/^-+|-+$/g, "") || "campaign-" + Date.now();

    let frameUrl = SecurityUtils.sanitizeUrl(campaignData.frameUrl);
    if (frameUrl && frameUrl.length > 650000) {
      try {
        frameUrl = await this.compressFrameDataUrl(frameUrl);
      } catch (e) {}
    }

    const user = AuthService.currentUser;
    const newCampaign = {
      ...campaignData,
      id: campaignData.id || "user-" + Date.now(),
      creatorUid: user ? user.uid : (campaignData.creatorUid || null),
      creatorEmail: user ? user.email : (campaignData.creatorEmail || null),
      titleKm: SecurityUtils.escapeHtml(campaignData.titleKm || ''),
      titleEn: SecurityUtils.escapeHtml(campaignData.titleEn || ''),
      slug: safeSlug,
      category: ['education', 'culture', 'charity', 'sports', 'tech', 'celebration'].includes(campaignData.category)
        ? campaignData.category
        : 'celebration',
      creator: SecurityUtils.escapeHtml(campaignData.creator || (user ? user.displayName : 'Anonymous')),
      descriptionKm: SecurityUtils.escapeHtml(campaignData.descriptionKm || ''),
      descriptionEn: SecurityUtils.escapeHtml(campaignData.descriptionEn || ''),
      caption: SecurityUtils.escapeHtml(campaignData.caption || ''),
      frameUrl: frameUrl,
      supporters: Math.max(1, parseInt(campaignData.supporters, 10) || 1),
      createdAt: new Date().toISOString().split("T")[0],
      isUserCreated: true
    };

    userCampaigns.unshift(newCampaign);
    try {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userCampaigns));
    } catch (err) {
      console.warn("Storage quota exceeded, removing oldest custom campaigns:", err);
      if (userCampaigns.length > 1) {
        userCampaigns.pop();
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(userCampaigns));
        } catch (e2) {}
      }
    }

    // Save to Cloud Firestore so it is instantly accessible worldwide
    const db = initFirestore();
    if (db) {
      db.collection("campaigns").doc(newCampaign.slug || newCampaign.id).set(newCampaign)
        .then(() => console.log("🔥 Campaign synced to Cloud Firestore:", newCampaign.slug))
        .catch(err => console.warn("Cloud Firestore sync error:", err));
    }

    return newCampaign;
  },

  // Sync a single campaign to Cloud Firestore
  async syncSingleCampaignToCloud(campaign) {
    const db = initFirestore();
    if (!db || !campaign) return false;
    const docId = campaign.slug || campaign.id;
    if (!docId) return false;

    try {
      let dataToSave = { ...campaign };
      if (dataToSave.frameUrl && dataToSave.frameUrl.length > 650000) {
        dataToSave.frameUrl = await this.compressFrameDataUrl(dataToSave.frameUrl);
