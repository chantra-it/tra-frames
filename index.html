<!DOCTYPE html>
<html lang="km" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tra Frames — Next-Gen Campaign Photo Frame Platform</title>
  <meta name="description" content="Tra Frames - Modern, fast, and beautiful photo frame platform for social media campaigns, celebrations, and causes.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><circle cx='12' cy='12' r='10'/></svg>">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <!-- Brand Logo -->
      <div class="nav-brand" onclick="window.location.hash='#explore'">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5" style="width:20px;height:20px;"><rect width="18" height="18" x="3" y="3" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
        </div>
        <span>Tra <span style="color:var(--accent-primary);">Frames</span></span>
      </div>

      <!-- Desktop Nav Links -->
      <nav class="nav-links">
        <a class="nav-link active" data-route="explore" onclick="window.location.hash='#explore'">
          <span data-i18n="explore">រុករកយុទ្ធនាការ</span>
        </a>
        <a class="nav-link" data-route="create" onclick="window.location.hash='#create'">
          <span data-i18n="createCampaign">បង្កើតយុទ្ធនាការ</span>
        </a>
        <a class="nav-link" data-route="designer" onclick="window.location.hash='#designer'">
          <span data-i18n="frameDesigner">រចនាស៊ុមក្នុង App</span>
        </a>
        <a class="nav-link" data-route="my-campaigns" onclick="window.location.hash='#my-campaigns'">
          <span data-i18n="myCampaigns">យុទ្ធនាការរបស់ខ្ញុំ</span>
        </a>
      </nav>

      <!-- Nav Actions (Lang, Theme, CTA) -->
      <div class="nav-actions">
        <!-- Language Switcher -->
        <button class="btn-icon" id="langToggleBtn" title="Change Language / ប្តូរភាសា" onclick="setLanguage(getLanguage() === 'km' ? 'en' : 'km')">
          <span id="langBtnText" style="font-size: 0.82rem; font-weight: 800;">ខ្មែរ</span>
        </button>

        <!-- Theme Switcher -->
        <button class="btn-icon" id="themeToggleBtn" title="Toggle Theme" onclick="app.toggleTheme()">
          <!-- Icon injected by app.js -->
        </button>

        <!-- Quick Create Button -->
        <button class="btn btn-primary" style="padding: 0.55rem 1.15rem; font-size: 0.88rem;" onclick="window.location.hash='#create'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
          <span data-i18n="createCampaign">បង្កើតយុទ្ធនាការ</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Application Content Area -->
  <main id="appContent" class="main-wrapper">
    <!-- Rendered dynamically by app.js -->
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <div class="mobile-bottom-bar">
    <div class="mobile-nav-item active" data-route="explore" onclick="window.location.hash='#explore'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
      <span data-i18n="explore">រុករក</span>
    </div>
    <div class="mobile-nav-item" data-route="create" onclick="window.location.hash='#create'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
      <span data-i18n="createCampaign">បង្កើត</span>
    </div>
    <div class="mobile-nav-item" data-route="designer" onclick="window.location.hash='#designer'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/></svg>
      <span data-i18n="frameDesigner">រចនាស៊ុម</span>
    </div>
    <div class="mobile-nav-item" data-route="my-campaigns" onclick="window.location.hash='#my-campaigns'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px;"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span data-i18n="myCampaigns">របស់ខ្ញុំ</span>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/campaign-data.js"></script>
  <script src="js/canvas-studio.js"></script>
  <script src="js/frame-designer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
