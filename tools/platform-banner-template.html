<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #070b16;
      font-family: 'Plus Jakarta Sans', 'Kantumruy Pro', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }
    .banner-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, rgba(37, 99, 235, 0.4) 0%, transparent 60%),
                  radial-gradient(circle at 20% 80%, rgba(14, 165, 233, 0.25) 0%, transparent 50%),
                  #070b16;
      z-index: 0;
    }
    .banner-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at center, black 60%, transparent 90%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 60%, transparent 90%);
      z-index: 1;
    }
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 900px;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      background: rgba(37, 99, 235, 0.2);
      border: 1.5px solid rgba(59, 130, 246, 0.5);
      padding: 10px 24px;
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.3);
    }
    .logo-badge span {
      background: linear-gradient(135deg, #60a5fa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 {
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 48px;
      font-weight: 800;
      line-height: 1.3;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }
    p {
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 22px;
      color: #94a3b8;
      max-width: 780px;
      line-height: 1.6;
    }
    .features {
      display: flex;
      gap: 24px;
      margin-top: 10px;
    }
    .feat-tag {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 18px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="banner-bg"></div>
  <div class="banner-grid"></div>

  <div class="content">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1" fill="#60a5fa"/></svg>
      Tra <span>Frames</span>
    </div>
    
    <h1>កម្មវិធីបង្កើត និងរចនាស៊ុមរូបថតគាំទ្រយុទ្ធនាការ</h1>
    <p>បង្កើតស៊ុមរូបថតស្អាតៗ រហ័ស និងងាយស្រួល ចែករំលែកទៅកាន់បណ្ដាញសង្គម Telegram, Facebook, WhatsApp បានភ្លាមៗ!</p>

    <div class="features">
      <div class="feat-tag">🎨 Canvas Studio</div>
      <div class="feat-tag">⚡ Ultra-Fast Export</div>
      <div class="feat-tag">🌐 Share Anywhere</div>
    </div>
  </div>
</body>
</html>
